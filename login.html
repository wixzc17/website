<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static 登录</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><text x='50' y='65' font-size='60' fill='%23ffffff' text-anchor='middle' font-family='cursive'>i</text></svg>">
    <script src="/static-crypto.js"></script>
    <script>
        // SHA-256 纯前端实现（用于生成密码哈希，方便用户在本地算好再填入 Vercel 环境变量）
        async function sha256(text) {
            const data = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        // 确保账号拥有身份密钥（v2 密钥体系）
        // 没有就在本地生成一对，用密码哈希派生的 KEK 加密后上传；私钥明文不出浏览器
        // 失败不影响登录，最坏情况只是暂时用不了新密钥体系（旧链路照常工作）
        async function ensureIdentityKeys(id, hash, hasKeys) {
            if (hasKeys) return;
            try {
                const token = sessionStorage.getItem('static_token') || '';
                const identity = await StaticKeys.generateIdentity();
                const privEnc = await StaticKeys.exportEncryptedPrivate(identity.privKey, hash, id);
                await fetch('/api/keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, pub: identity.pubB64, privEnc: privEnc })
                });
            } catch (e) { /* 静默失败：登录流程不该被密钥初始化拖住 */ }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const idInput = document.getElementById('id-input');
            const passwordInput = document.getElementById('password-input');
            const loginError = document.getElementById('login-error');
            const loginBtn = document.getElementById('login-btn');

            // 哈希生成工具的元素（隐藏彩蛋：连点标题 7 次才会出现）
            const toolToggle = document.getElementById('tool-toggle');
            const toolPanel = document.getElementById('tool-panel');
            const toolPassword = document.getElementById('tool-password');
            const toolBtn = document.getElementById('tool-btn');
            const toolResult = document.getElementById('tool-result');
            const loginTitle = document.getElementById('login-title');

            let titleClicks = 0;
            let clickTimer = null;
            loginTitle.addEventListener('click', function() {
                titleClicks++;
                clearTimeout(clickTimer);
                clickTimer = setTimeout(() => { titleClicks = 0; }, 1500);
                if (titleClicks >= 7) {
                    titleClicks = 0;
                    toolToggle.style.display = 'inline';
                    toolToggle.click();
                }
            });

            // 自动登录：本设备登录过（localStorage 存有 ID + 密码哈希）则静默登录
            // 只存哈希不存明文密码；退出登录会清除记忆
            (async function autoLogin() {
                let rid = null, rhash = null;
                try {
                    rid = localStorage.getItem('static_remember_id');
                    rhash = localStorage.getItem('static_remember_hash');
                } catch (e) { return; }
                if (!rid || !rhash) return;

                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: rid, hash: rhash })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        try {
                            sessionStorage.setItem('static_id', rid);
                            sessionStorage.setItem('static_name', data.name || ('@' + rid));
                            sessionStorage.setItem('static_token', data.token || '');
                            sessionStorage.setItem('static_hash', rhash);
                        } catch (e) {}
                        await ensureIdentityKeys(rid, rhash, data.hasKeys);
                        window.location.href = 'static.html';
                    } else {
                        // 记住的凭证已失效（如密码被修改），清除后回到手动登录
                        try {
                            localStorage.removeItem('static_remember_id');
                            localStorage.removeItem('static_remember_hash');
                        } catch (e) {}
                    }
                } catch (e) { /* 网络异常则留在登录页手动登录 */ }
            })();

            // ---------- 注册 / 登录切换 ----------
            const registerToggle = document.getElementById('register-toggle');
            const nameField = document.getElementById('name-field');
            const inviteField = document.getElementById('invite-field');
            const confirmField = document.getElementById('confirm-field');
            const inviteHint = document.getElementById('invite-hint');
            const loginBtn2 = document.getElementById('login-btn');
            let isRegister = false;

            function setMode(register) {
                isRegister = register;
                nameField.style.display = register ? 'block' : 'none';
                inviteField.style.display = register ? 'block' : 'none';
                confirmField.style.display = register ? 'block' : 'none';
                inviteHint.style.display = register ? 'block' : 'none';
                loginBtn2.textContent = register ? '注册' : '登录';
                registerToggle.textContent = register ? '已有账号？登录' : '没有账号？注册';
                loginError.textContent = '';
            }

            registerToggle.addEventListener('click', function() {
                setMode(!isRegister);
            });

            // 注册 + 登录共用同一个表单提交逻辑
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                loginError.textContent = '';

                const id = idInput.value.trim().replace(/^@/, '');
                const password = passwordInput.value;

                if (!id || !password) {
                    loginError.textContent = '请输入 ID 和密码';
                    return;
                }

                loginBtn2.disabled = true;
                loginBtn2.textContent = isRegister ? '注册中...' : '验证中...';

                try {
                    const hash = await sha256(password);

                    if (isRegister) {
                        // 注册：先走注册接口（需邀请码）
                        const name = document.getElementById('name-input').value.trim();
                        const confirm = document.getElementById('confirm-input').value;
                        const invite = document.getElementById('invite-input').value.trim();
                        if (password !== confirm) {
                            loginError.textContent = '两次输入的密码不一致';
                            loginBtn2.disabled = false;
                            loginBtn2.textContent = '注册';
                            return;
                        }
                        const regRes = await fetch('/api/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id: id, hash: hash, name: name, invite: invite })
                        });
                        const regData = await regRes.json();
                        if (!regData.ok) {
                            loginError.textContent = regData.message || '注册失败';
                            loginBtn2.disabled = false;
                            loginBtn2.textContent = '注册';
                            return;
                        }
                    }

                    // 登录（注册成功后自动登录）
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: id, hash: hash })
                    });
                    const data = await res.json();

                    if (data.ok) {
                        // 保存会话信息（token 用于接口验证，hash 用于派生消息加密密钥）
                        try {
                            sessionStorage.setItem('static_id', id);
                            sessionStorage.setItem('static_name', data.name || ('@' + id));
                            sessionStorage.setItem('static_token', data.token || '');
                            sessionStorage.setItem('static_hash', hash);
                            // 记住这台设备（下次访问静默自动登录）
                            localStorage.setItem('static_remember_id', id);
                            localStorage.setItem('static_remember_hash', hash);
                        } catch (e) { /* 隐私模式下存不进去，聊天功能将不可用 */ }
                        if (!data.hasKeys) {
                            loginBtn2.textContent = '生成密钥中...';
                            await ensureIdentityKeys(id, hash, data.hasKeys);
                        }
                        window.location.href = 'static.html';
                    } else {
                        loginError.textContent = data.message || 'ID 或密码不正确';
                        loginBtn2.disabled = false;
                        loginBtn2.textContent = isRegister ? '注册' : '登录';
                    }
                } catch (err) {
                    loginError.textContent = '网络异常，请稍后再试';
                    loginBtn2.disabled = false;
                    loginBtn2.textContent = isRegister ? '注册' : '登录';
                }
            });

            // 哈希生成工具的显示/隐藏（需先通过标题彩蛋显示入口）
            toolToggle.style.display = 'none';
            toolPanel.style.display = 'none';
            toolToggle.addEventListener('click', function() {
                toolPanel.style.display = toolPanel.style.display === 'none' ? 'block' : 'none';
            });

            // 生成哈希
            toolBtn.addEventListener('click', async function() {
                const pwd = toolPassword.value;
                if (!pwd) {
                    toolResult.textContent = '请先输入密码';
                    return;
                }
                const hash = await sha256(pwd);
                toolResult.textContent = hash;
            });
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000000;
            font-family: Arial, sans-serif;
        }

        .login-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-title {
            font-size: 40px;
            font-weight: 700;
            font-style: italic;
            margin-bottom: 40px;
            color: #ffffff;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', 'Monaco', 'Courier New', monospace;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
            line-height: 1;
            cursor: default;
            user-select: none;
        }

        .login-form {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
        }

        .form-field {
            margin-bottom: 18px;
        }

        .form-field label {
            display: block;
            font-size: 12px;
            color: #888888;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .form-field input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #ffffff;
            border-radius: 0;
            padding: 10px 2px;
            font-size: 15px;
            background: #000000;
            color: #ffffff;
            outline: none;
        }

        .form-field input:focus {
            border-color: #ffffff;
        }

        .form-field input::placeholder {
            color: #444444;
        }

        .login-btn {
            width: 100%;
            border: 1px solid #ffffff;
            border-radius: 0;
            padding: 12px;
            font-size: 15px;
            background: #000000;
            color: #ffffff;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            margin-top: 6px;
        }

        .login-btn:hover:not(:disabled) {
            background: #ffffff;
            color: #000000;
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-error {
            min-height: 20px;
            font-size: 13px;
            color: #aa6666;
            text-align: center;
            margin-top: 10px;
        }

        .register-toggle {
            margin-top: 4px;
            background: none;
            border: none;
            font-size: 12px;
            color: #666666;
            cursor: pointer;
            letter-spacing: 1px;
            padding: 0;
            transition: color 0.3s ease;
        }

        .register-toggle:hover {
            color: #ffffff;
        }

        .invite-hint {
            width: 100%;
            max-width: 360px;
            margin-top: 18px;
            font-size: 12px;
            color: #666666;
            line-height: 1.8;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .tool-section {
            margin-top: 30px;
            width: 100%;
            max-width: 360px;
        }

        .tool-toggle {
            font-size: 12px;
            color: #666666;
            cursor: pointer;
            letter-spacing: 1px;
            background: none;
            border: none;
            padding: 0;
        }

        .tool-toggle:hover {
            color: #ffffff;
        }

        .tool-panel {
            display: none;
            margin-top: 14px;
            padding: 16px;
            border: 1px solid #262626;
            border-radius: 8px;
        }

        .tool-panel p {
            font-size: 12px;
            color: #888888;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .tool-row {
            display: flex;
            gap: 8px;
        }

        .tool-row input {
            flex: 1;
            border: 1px solid #404040;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            background: #000000;
            color: #ffffff;
            outline: none;
        }

        .tool-row button {
            border: 1px solid #404040;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 13px;
            background: #000000;
            color: #ffffff;
            cursor: pointer;
            white-space: nowrap;
        }

        .tool-row button:hover {
            background: #ffffff;
            color: #000000;
        }

        .tool-result {
            margin-top: 12px;
            font-size: 11px;
            color: #888888;
            word-break: break-all;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            line-height: 1.5;
        }

        .back-link {
            position: fixed;
            top: 16px;
            left: 20px;
            font-size: 13px;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .footer {
            text-align: center;
            padding: 20px;
        }

        .copyright {
            font-size: 14px;
            color: #888888;
            font-style: italic;
            font-weight: bold;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .login-title {
                font-size: 32px;
                margin-bottom: 30px;
            }

            .back-link {
                top: 10px;
                left: 12px;
                font-size: 11px;
            }

            .copyright {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <a class="back-link" href="index.html">&larr; index</a>

    <div class="login-content">
        <div class="login-title" id="login-title">Static</div>

        <form class="login-form" id="login-form">
            <div class="form-field">
                <label for="id-input">ID</label>
                <input type="text" id="id-input" placeholder="@your_id" autocomplete="off" autocapitalize="off" spellcheck="false">
            </div>

            <div class="form-field" id="name-field" style="display:none">
                <label for="name-input">名字（可选）</label>
                <input type="text" id="name-input" placeholder="" autocomplete="off" maxlength="16">
            </div>

            <div class="form-field" id="invite-field" style="display:none">
                <label for="invite-input">邀请码</label>
                <input type="text" id="invite-input" placeholder="" autocomplete="off" inputmode="numeric" maxlength="6">
            </div>

            <div class="form-field">
                <label for="password-input">密码</label>
                <input type="password" id="password-input" placeholder="••••••••" autocomplete="off">
            </div>

            <div class="form-field" id="confirm-field" style="display:none">
                <label for="confirm-input">确认密码</label>
                <input type="password" id="confirm-input" placeholder="••••••••" autocomplete="off">
            </div>

            <button type="submit" class="login-btn" id="login-btn">登录</button>

            <div class="login-error" id="login-error"></div>
        </form>

        <div class="invite-hint" id="invite-hint" style="display:none">
            本站采用邀请制注册。想要邀请码，请联系：<br>
            任继锋 1518629477@qq.com<br>
            汪子雯 2425731355@qq.com
        </div>

        <button type="button" class="register-toggle" id="register-toggle">没有账号？注册</button>

        <div class="tool-section">
            <button type="button" class="tool-toggle" id="tool-toggle">首次使用？生成密码哈希 &gt;</button>
            <div class="tool-panel" id="tool-panel">
                <p>输入你想设置的密码，点击生成。把得到的哈希值按说明填入 Vercel 环境变量 STATIC_USERS，即可完成账号注册。密码明文不会被发送到任何地方。</p>
                <div class="tool-row">
                    <input type="password" id="tool-password" placeholder="想设置的密码">
                    <button type="button" id="tool-btn">生成哈希</button>
                </div>
                <div class="tool-result" id="tool-result"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="copyright">Copyright &copy; 2026 Ren Jifeng &amp; Wang Ziwen. All rights reserved.</div>
    </div>
</body>
</html>
