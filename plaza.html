<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Static · 广场</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><text x='50' y='65' font-size='60' fill='%23ffffff' text-anchor='middle' font-family='cursive'>i</text></svg>">
    <script src="/verified-badge.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const myId = sessionStorage.getItem('static_id');
            const myName = sessionStorage.getItem('static_name') || myId;
            const myToken = sessionStorage.getItem('static_token');

            if (!myId || !myToken) {
                window.location.href = 'login.html';
                return;
            }

            // 左上角身份
            document.getElementById('me-name').textContent = myName;
            document.getElementById('me-id').textContent = '@' + myId;
            document.getElementById('profile-link').href = 'user.html?id=' + encodeURIComponent(myId);
            const meAvatar = document.getElementById('me-avatar');
            meAvatar.textContent = (myName || '@').charAt(0).toUpperCase();

            // ---------- 侧边栏 ----------
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebar-overlay');
            function openSidebar() { sidebar.classList.add('open'); sidebarOverlay.classList.add('show'); }
            function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('show'); }
            meAvatar.addEventListener('click', openSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);
            document.getElementById('sidebar-close').addEventListener('click', closeSidebar);

            async function fetchProfile(id) {
                try {
                    const res = await fetch('/api/profile?id=' + encodeURIComponent(id));
                    const data = await res.json();
                    if (data.ok) return { name: data.name, avatar: data.avatar };
                } catch (e) {}
                return null;
            }

            fetchProfile(myId).then(p => {
                if (p) {
                    document.getElementById('me-name').textContent = p.name;
                    if (p.avatar) {
                        meAvatar.textContent = '';
                        meAvatar.style.backgroundImage = 'url(' + p.avatar + ')';
                        meAvatar.classList.add('has-img');
                    }
                }
                VerifiedBadge.attach(document.getElementById('me-name'), myId);
            });

            document.getElementById('logout-sidebar-btn').addEventListener('click', function() {
                closeSidebar();
                sessionStorage.clear();
                try {
                    localStorage.removeItem('static_remember_id');
                    localStorage.removeItem('static_remember_hash');
                } catch (e) {}
                window.location.href = 'index.html';
            });

            // ---------- 推文广场 ----------
            const feedEl = document.getElementById('plaza-feed');
            const composerInput = document.getElementById('composer-input');
            const composerCount = document.getElementById('composer-count');
            const composerSend = document.getElementById('composer-send');
            const MAX_TEXT = 500;

            function timeAgo(ts) {
                const s = Math.floor((Date.now() - ts) / 1000);
                if (s < 60) return '刚刚';
                if (s < 3600) return Math.floor(s / 60) + '分钟前';
                if (s < 86400) return Math.floor(s / 3600) + '小时前';
                const d = new Date(ts);
                return (d.getMonth() + 1) + '月' + d.getDate() + '日';
            }

            function esc(s) {
                return String(s).replace(/[&<>"']/g, function(c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            const ICON_LIKE = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 20 C8 16 4 13 4 8.5 C4 6 6 4.5 8 4.5 C10 4.5 12 6 12 6 C12 6 14 4.5 16 4.5 C18 4.5 20 6 20 8.5 C20 13 16 16 12 20 Z"/></svg>';
            const ICON_COMMENT = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 5h16v12H8l-4 4z"/></svg>';

            function renderFeed(posts) {
                feedEl.innerHTML = '';
                if (!posts || !posts.length) {
                    const empty = document.createElement('div');
                    empty.className = 'feed-empty';
                    empty.textContent = '还没有推文，发第一条吧';
                    feedEl.appendChild(empty);
                    return;
                }
                posts.forEach(function(p) { feedEl.appendChild(makePostCard(p)); });
            }

            function makePostCard(p) {
                const card = document.createElement('div');
                card.className = 'post';
                card.dataset.id = p.id;

                const head = document.createElement('div');
                head.className = 'post-head';

                const avatar = document.createElement('div');
                avatar.className = 'post-avatar';
                if (p.avatar) {
                    avatar.style.backgroundImage = 'url(' + p.avatar + ')';
                    avatar.classList.add('has-img');
                } else {
                    avatar.textContent = (p.name || '@').charAt(0).toUpperCase();
                }
                head.appendChild(avatar);

                const meta = document.createElement('div');
                meta.className = 'post-meta';
                const nameRow = document.createElement('div');
                nameRow.className = 'post-name-row';
                const nameEl = document.createElement('span');
                nameEl.className = 'post-name';
                nameEl.textContent = p.name;
                nameRow.appendChild(nameEl);
                const idEl = document.createElement('div');
                idEl.className = 'post-id';
                idEl.textContent = '@' + p.author + ' · ' + timeAgo(p.ts);
                meta.appendChild(nameRow);
                meta.appendChild(idEl);
                head.appendChild(meta);

                // 认证标记（服务端没带 verified，这里用共享助手查）
                VerifiedBadge.attach(nameEl, p.author);

                // 自己的推文 → 删除按钮
                if (p.author === myId) {
                    const del = document.createElement('button');
                    del.className = 'post-del';
                    del.type = 'button';
                    del.textContent = '删';
                    del.title = '删除';
                    head.appendChild(del);
                }
                card.appendChild(head);

                const text = document.createElement('div');
                text.className = 'post-text';
                text.textContent = p.text;
                card.appendChild(text);

                // 操作行：点赞 / 评论
                const actions = document.createElement('div');
                actions.className = 'post-actions';

                const likeBtn = document.createElement('button');
                likeBtn.className = 'act' + (p.likedByMe ? ' liked' : '');
                likeBtn.type = 'button';
                likeBtn.innerHTML = ICON_LIKE + '<span class="act-num">' + p.likeCount + '</span>';
                likeBtn.addEventListener('click', function() { toggleLike(card, p, likeBtn); });
                actions.appendChild(likeBtn);

                const cmtBtn = document.createElement('button');
                cmtBtn.className = 'act';
                cmtBtn.type = 'button';
                cmtBtn.innerHTML = ICON_COMMENT + '<span class="act-num">' + p.commentCount + '</span>';
                cmtBtn.addEventListener('click', function() { toggleComments(card, p); });
                actions.appendChild(cmtBtn);

                card.appendChild(actions);

                // 评论区（懒加载）
                const comments = document.createElement('div');
                comments.className = 'post-comments';
                comments.hidden = true;
                card.appendChild(comments);

                return card;
            }

            // 点赞 / 取消点赞
            async function toggleLike(card, p, btn) {
                try {
                    const res = await fetch('/api/posts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: myToken, postId: p.id, action: 'like' })
                    });
                    if (res.status === 401) { window.location.href = 'login.html'; return; }
                    const data = await res.json();
                    if (data.ok) {
                        p.likedByMe = data.liked;
                        p.likeCount = data.likeCount;
                        btn.classList.toggle('liked', data.liked);
                        btn.querySelector('.act-num').textContent = data.likeCount;
                    }
                } catch (e) {}
            }

            // 拉取并渲染评论（可复用：首次展开 / 发评论后刷新）
            async function loadComments(box, p) {
                box.innerHTML = '<div class="cmt-loading">加载评论…</div>';
                try {
                    const res = await fetch('/api/posts?comments=' + encodeURIComponent(p.id) + '&token=' + encodeURIComponent(myToken));
                    const data = await res.json();
                    if (!data.ok) { box.innerHTML = '<div class="cmt-loading">评论加载失败</div>'; return; }
                    renderComments(box, p, data.comments || []);
                } catch (e) {
                    box.innerHTML = '<div class="cmt-loading">评论加载失败</div>';
                }
            }

            // 展开 / 收起评论区
            async function toggleComments(card, p) {
                const box = card.querySelector('.post-comments');
                if (!box.hidden) { box.hidden = true; return; }
                box.hidden = false;
                loadComments(box, p);
            }

            function renderComments(box, p, comments) {
                box.innerHTML = '';
                if (comments.length) {
                    comments.forEach(function(c) {
                        const row = document.createElement('div');
                        row.className = 'cmt-row';
                        const head = document.createElement('span');
                        head.className = 'cmt-author';
                        head.textContent = c.name;
                        const body = document.createElement('span');
                        body.className = 'cmt-text';
                        body.textContent = c.text;
                        row.appendChild(head);
                        row.appendChild(body);
                        box.appendChild(row);
                    });
                } else {
                    const empty = document.createElement('div');
                    empty.className = 'cmt-loading';
                    empty.textContent = '还没有评论';
                    box.appendChild(empty);
                }
                // 评论输入框
                const input = document.createElement('div');
                input.className = 'cmt-input-row';
                input.innerHTML = '<input type="text" class="cmt-input" maxlength="500" placeholder="写评论…">' +
                    '<button type="button" class="cmt-send">发送</button>';
                box.appendChild(input);
                const inp = input.querySelector('.cmt-input');
                const send = input.querySelector('.cmt-send');
                send.addEventListener('click', function() { submitComment(box, p, inp, send); });
                inp.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submitComment(box, p, inp, send); }
                });
            }

            async function submitComment(box, p, inp, send) {
                const text = inp.value.trim();
                if (!text) return;
                send.disabled = true;
                try {
                    const res = await fetch('/api/posts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: myToken, postId: p.id, action: 'comment', text: text })
                    });
                    if (res.status === 401) { window.location.href = 'login.html'; return; }
                    const data = await res.json();
                    if (data.ok) {
                        inp.value = '';
                        // 刷新评论（保持展开）
                        loadComments(box, p);
                        // 更新评论计数
                        p.commentCount++;
                        const nums = box.closest('.post').querySelectorAll('.act-num');
                        if (nums[1]) nums[1].textContent = p.commentCount;
                    }
                } catch (e) {}
                send.disabled = false;
            }

            // 删除推文
            feedEl.addEventListener('click', function(e) {
                const del = e.target.closest('.post-del');
                if (!del) return;
                const card = del.closest('.post');
                const id = card.dataset.id;
                if (!confirm('删除这条推文？')) return;
                fetch('/api/posts?token=' + encodeURIComponent(myToken) + '&id=' + encodeURIComponent(id), { method: 'DELETE' })
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.ok) { card.remove(); }
                    })
                    .catch(function() {});
            });

            // 发推
            composerInput.addEventListener('input', function() {
                composerCount.textContent = composerInput.value.length + ' / ' + MAX_TEXT;
            });
            async function sendPost() {
                const text = composerInput.value.trim();
                if (!text) return;
                composerSend.disabled = true;
                try {
                    const res = await fetch('/api/posts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: myToken, text: text })
                    });
                    if (res.status === 401) { window.location.href = 'login.html'; return; }
                    const data = await res.json();
                    if (data.ok) {
                        composerInput.value = '';
                        composerCount.textContent = '0 / ' + MAX_TEXT;
                        loadFeed();
                    } else {
                        alert(data.message || '发送失败');
                    }
                } catch (e) {
                    alert('网络异常');
                }
                composerSend.disabled = false;
            }
            composerSend.addEventListener('click', sendPost);
            composerInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendPost(); }
            });

            // 拉取推文流
            async function loadFeed() {
                try {
                    const res = await fetch('/api/posts?token=' + encodeURIComponent(myToken));
                    if (res.status === 401) { window.location.href = 'login.html'; return; }
                    const data = await res.json();
                    if (data.ok) renderFeed(data.posts);
                } catch (e) {
                    feedEl.innerHTML = '<div class="feed-empty">加载失败</div>';
                }
            }
            loadFeed();

            // ---------- 下拉阻尼回弹 ----------
            const scroller = document.querySelector('.plaza-content');
            let pullStartY = 0, pulling = false;
            scroller.addEventListener('touchstart', function(e) {
                pulling = true;
                pullStartY = e.touches[0].clientY;
                feedEl.style.transition = 'none';
            }, { passive: true });
            scroller.addEventListener('touchmove', function(e) {
                if (!pulling) return;
                const dy = e.touches[0].clientY - pullStartY;
                if (dy > 0 && scroller.scrollTop <= 0) {
                    const offset = Math.pow(dy, 0.75);
                    feedEl.style.transform = 'translateY(' + offset + 'px)';
                    e.preventDefault();
                }
            }, { passive: false });
            function springBack() {
                if (!pulling) return;
                pulling = false;
                feedEl.style.transition = 'transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.1)';
                feedEl.style.transform = '';
            }
            scroller.addEventListener('touchend', springBack);
            scroller.addEventListener('touchcancel', springBack);
        });
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            font-family: Arial, sans-serif;
        }

        .plaza-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 150px 20px 30px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .plaza-feed {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .feed-empty {
            color: var(--text-dim);
            font-size: 14px;
            text-align: center;
            padding: 40px 0;
        }

        /* ---------- 发推框 ---------- */
        .composer {
            width: 100%;
            max-width: 420px;
            margin-bottom: 20px;
        }

        .composer-box {
            border-bottom: 1px solid var(--fg);
            padding-bottom: 10px;
        }

        .composer-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--fg);
            font-size: 15px;
            font-family: inherit;
            line-height: 1.5;
        }

        .composer-input::placeholder { color: var(--text-faint); }

        .composer-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }

        .composer-count { font-size: 12px; color: var(--text-faint); }

        .composer-send {
            width: 34px;
            height: 34px;
            border: 1px solid var(--fg);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .composer-send svg { width: 16px; height: 16px; stroke: var(--fg); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .composer-send:hover { background: var(--fg); }
        .composer-send:hover svg { stroke: var(--bg); }
        .composer-send:disabled { opacity: 0.4; pointer-events: none; }

        /* ---------- 推文卡片 ---------- */
        .post {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-strong);
        }

        .post-head { display: flex; align-items: flex-start; gap: 10px; }

        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: var(--fg);
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }

        .post-meta { flex: 1; min-width: 0; }

        .post-name-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        .post-name { font-size: 14px; font-weight: 700; color: var(--fg); }

        .post-id { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

        .post-del {
            background: none;
            border: none;
            color: var(--text-faint);
            font-size: 12px;
            cursor: pointer;
            padding: 2px 6px;
        }
        .post-del:hover { color: var(--fg); }

        .post-text {
            color: var(--text-body-bright);
            font-size: 15px;
            line-height: 1.6;
            margin: 10px 0 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .post-actions { display: flex; gap: 22px; margin-top: 8px; }

        .act {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-mid);
            font-size: 13px;
            padding: 4px 0;
        }

        .act svg { width: 18px; height: 18px; stroke: var(--text-mid); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s ease; }
        .act:hover svg { stroke: var(--fg); }
        .act.liked svg { stroke: var(--fg); fill: var(--fg); }
        .act.liked { color: var(--fg); }
        .act-num { color: inherit; }

        /* ---------- 评论区 ---------- */
        .post-comments {
            margin-top: 10px;
            padding: 10px 0 0 10px;
            border-left: 1px solid var(--border-soft);
        }

        .cmt-loading { color: var(--text-faint); font-size: 13px; padding: 4px 0; }

        .cmt-row { padding: 5px 0; font-size: 13px; line-height: 1.5; }

        .cmt-author { color: var(--fg); font-weight: 700; margin-right: 8px; }

        .cmt-text { color: var(--text-body); word-break: break-word; }

        .cmt-input-row { display: flex; gap: 8px; margin-top: 8px; }

        .cmt-input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-soft);
            outline: none;
            color: var(--fg);
            font-size: 13px;
            font-family: inherit;
            padding: 4px 0;
        }
        .cmt-input:focus { border-bottom-color: var(--fg); }

        .cmt-send {
            background: none;
            border: 1px solid var(--fg);
            color: var(--fg);
            font-size: 12px;
            cursor: pointer;
            padding: 4px 10px;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .cmt-send:hover { background: var(--fg); color: var(--bg); }
        .cmt-send:disabled { opacity: 0.4; pointer-events: none; }

        /* ---------- 原有：返回 / 身份 / 侧边栏 / 底栏 ---------- */
        .back-link {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top));
            left: 20px;
            font-size: 13px;
            color: var(--fg);
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }
        .back-link:hover { opacity: 0.7; }

        .me-info {
            position: fixed;
            top: calc(64px + env(safe-area-inset-top));
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        .me-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--fg);
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            cursor: pointer;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            transition: border-color 0.3s ease;
        }
        .me-avatar:hover { border-color: var(--fg); }

        .me-text { display: flex; flex-direction: column; gap: 2px; }
        .me-name { font-size: 15px; color: var(--fg); font-weight: 700; }
        .me-id { font-size: 12px; color: var(--text-mid); }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1999;
        }
        .sidebar-overlay.show { opacity: 1; pointer-events: auto; }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 240px;
            background: var(--bg-soft);
            border-right: 1px solid var(--border-strong);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 2000;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }
        .sidebar.open { transform: translateX(0); }

        .sidebar-item {
            display: block;
            padding: 12px 20px;
            font-size: 14px;
            color: var(--fg);
            text-decoration: none;
            transition: background 0.2s ease;
        }
        .sidebar-item:hover { background: var(--bg-hover); }

        .sidebar-close {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 18px;
            color: var(--text-mid);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
        }
        .sidebar-close:hover { color: var(--fg); }

        .sidebar-logout {
            margin-top: auto;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .bottom-bar {
            display: flex;
            height: 72px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .bar-tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .bar-tab svg {
            width: 26px;
            height: 26px;
            stroke: var(--fg);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.3s ease;
        }
        .bar-tab:hover { background: var(--fg); }
