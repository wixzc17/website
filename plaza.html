<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static · 广场</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><text x='50' y='65' font-size='60' fill='%23ffffff' text-anchor='middle' font-family='cursive'>i</text></svg>">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const myId = sessionStorage.getItem('static_id');
            const myName = sessionStorage.getItem('static_name') || myId;
            const myToken = sessionStorage.getItem('static_token');

            // 未登录 → 回登录页
            if (!myId || !myToken) {
                window.location.href = 'login.html';
                return;
            }

            // 左上角显示自己的身份（头像先用名字首字符占位）
            document.getElementById('me-name').textContent = myName;
            document.getElementById('me-id').textContent = '@' + myId;
            const meAvatar = document.getElementById('me-avatar');
            meAvatar.textContent = (myName || '@').charAt(0).toUpperCase();

            // ---------- 侧边栏 ----------
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebar-overlay');

            function openSidebar() {
                sidebar.classList.add('open');
                sidebarOverlay.classList.add('show');
            }
            function closeSidebar() {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('show');
            }
            meAvatar.addEventListener('click', openSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);
            document.getElementById('sidebar-close').addEventListener('click', closeSidebar);

            // ---------- 拉取自己的最新资料（头像/名字） ----------
            async function fetchProfile(id) {
                try {
                    const res = await fetch('/api/profile?id=' + encodeURIComponent(id));
                    const data = await res.json();
                    if (data.ok) return { name: data.name, avatar: data.avatar };
                } catch (e) {}
                return null;
            }

            fetchProfile(myId).then(p => {
                if (p) {
                    document.getElementById('me-name').textContent = p.name;
                    if (p.avatar) {
                        meAvatar.textContent = '';
                        meAvatar.style.backgroundImage = 'url(' + p.avatar + ')';
                        meAvatar.classList.add('has-img');
                    }
                }
            });

            // ---------- 下拉阻尼回弹（列表不满屏时也有橡皮筋手感） ----------
            const scroller = document.querySelector('.plaza-content');
            const feedList = document.getElementById('plaza-feed');
            let pullStartY = 0, pulling = false;

            scroller.addEventListener('touchstart', function(e) {
                pulling = true;
                pullStartY = e.touches[0].clientY;
                feedList.style.transition = 'none';
            }, { passive: true });

            scroller.addEventListener('touchmove', function(e) {
                if (!pulling) return;
                const dy = e.touches[0].clientY - pullStartY;
                if (dy > 0 && scroller.scrollTop <= 0) {
                    const offset = Math.pow(dy, 0.75);
                    feedList.style.transform = 'translateY(' + offset + 'px)';
                    e.preventDefault();
                }
            }, { passive: false });

            function springBack() {
                if (!pulling) return;
                pulling = false;
                feedList.style.transition = 'transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.1)';
                feedList.style.transform = '';
            }
            scroller.addEventListener('touchend', springBack);
            scroller.addEventListener('touchcancel', springBack);

            // 退出登录（侧边栏里，同时清除本设备的自动登录记忆）
            document.getElementById('logout-sidebar-btn').addEventListener('click', function() {
                closeSidebar();
                sessionStorage.clear();
                try {
                    localStorage.removeItem('static_remember_id');
                    localStorage.removeItem('static_remember_hash');
                } catch (e) {}
                window.location.href = 'index.html';
            });
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            display: flex;
            flex-direction: column;
            background: #000000;
            font-family: Arial, sans-serif;
        }

        .plaza-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 150px 20px 30px;
            overflow-y: auto;          /* 推文多时可滚动，滚动只发生在内容区内部 */
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .plaza-feed {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .back-link {
            position: fixed;
            top: 16px;
            left: 20px;
            font-size: 13px;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .me-info {
            position: fixed;
            top: 64px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        .me-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid #404040;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            cursor: pointer;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            transition: border-color 0.3s ease;
        }

        .me-avatar:hover {
            border-color: #ffffff;
        }

        .me-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .me-name {
            font-size: 15px;
            color: #ffffff;
            font-weight: 700;
        }

        .me-id {
            font-size: 12px;
            color: #888888;
        }

        /* 侧边栏 */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1999;
        }

        .sidebar-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 240px;
            background: #0a0a0a;
            border-right: 1px solid #262626;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 2000;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-item {
            display: block;
            padding: 12px 20px;
            font-size: 14px;
            color: #ffffff;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .sidebar-item:hover {
            background: #1a1a1a;
        }

        .sidebar-close {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 18px;
            color: #888888;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
        }

        .sidebar-close:hover {
            color: #ffffff;
        }

        .sidebar-logout {
            margin-top: auto;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        /* 底部栏：竖线一分为二，左 chat 入口，右留空 */
        .bottom-bar {
            display: flex;
            height: 72px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .bar-tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .bar-tab svg {
            width: 26px;
            height: 26px;
            stroke: #ffffff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.3s ease;
        }

        .bar-tab:hover {
            background: #ffffff;
        }

        .bar-tab:hover svg {
            stroke: #000000;
        }

        .bar-empty {
            pointer-events: none;
        }

        /* 分隔竖线：短于底栏高度，居中 */
        .bar-empty::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1px;
            height: 26px;
            background: #ffffff;
        }

        @media (max-width: 768px) {
            .plaza-content {
                padding: 110px 16px 24px;
            }

            .back-link {
                top: 10px;
                left: 12px;
                font-size: 11px;
            }

            .me-info {
                top: 50px;
                left: 12px;
                gap: 8px;
            }

            .me-avatar {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }

            .me-name {
                font-size: 14px;
            }

            .me-id {
                font-size: 11px;
            }

            .bottom-bar {
                height: 60px;
            }

            .bar-tab svg {
                width: 22px;
                height: 22px;
            }
        }
    </style>
</head>
<body>
    <a class="back-link" href="index.html">&larr; index</a>

    <div class="me-info">
        <div class="me-avatar" id="me-avatar" title="个人资料">@</div>
        <div class="me-text">
            <div class="me-name" id="me-name"></div>
            <div class="me-id" id="me-id"></div>
        </div>
    </div>

    <!-- 侧边栏（点头像弹出） -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="sidebar" id="sidebar">
        <button class="sidebar-close" id="sidebar-close" type="button">&times;</button>
        <a class="sidebar-item" href="profile.html">个人资料</a>
        <button class="sidebar-item sidebar-logout" id="logout-sidebar-btn" type="button">退出登录</button>
    </div>

    <!-- 广场内容区（推文列表，暂空） -->
    <div class="plaza-content">
        <div class="plaza-feed" id="plaza-feed"></div>
    </div>

    <!-- 底部栏：竖线一分为二，左 chat 入口，当前页在右 -->
    <div class="bottom-bar">
        <a class="bar-tab" href="static.html" title="chat" aria-label="chat">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 4h16v12H8l-4 4z"/>
            </svg>
        </a>
        <a class="bar-tab" href="plaza.html" title="plaza" aria-label="plaza">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                <path d="M4.93 19.07a10 10 0 0 1 0-14.14"/>
                <path d="M17 7a7.3 7.3 0 0 1 0 10"/>
                <path d="M7 17a7.3 7.3 0 0 1 0-10"/>
                <path d="M12 8 L13.4 10.6 L16 12 L13.4 13.4 L12 16 L10.6 13.4 L8 12 L10.6 10.6 Z"/>
            </svg>
        </a>
    </div>
</body>
</html>
