<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><text x='50' y='65' font-size='60' fill='%23ffffff' text-anchor='middle' font-family='cursive'>i</text></svg>">
    <script src="/verified-badge.js"></script>
    <script>
        // 共享加密工具：AES-GCM 加解密（浏览器本地完成，密文上链）
        // 密钥由双方约定，写在这里会暴露——改为从登录用户可获取的约定值派生：
        // 用「两人ID + 共同密码哈希」派生密钥，只有登录者能算出（密码哈希只在登录时存在于内存）
        const StaticCrypto = {
            async deriveKey(myId, peerId, passwordHash) {
                const material = [myId, peerId].sort().join('::') + '::' + passwordHash;
                const raw = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(material));
                return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
            },
            async encrypt(key, plaintext) {
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(plaintext));
                // base64 编码 iv + 密文
                return btoa(String.fromCharCode(...iv)) + '.' + btoa(String.fromCharCode(...new Uint8Array(ct)));
            },
            async decrypt(key, payload) {
                try {
                    const parts = payload.split('.');
                    if (parts.length !== 2) return null;
                    const iv = Uint8Array.from(atob(parts[0]), c => c.charCodeAt(0));
                    const ct = Uint8Array.from(atob(parts[1]), c => c.charCodeAt(0));
                    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
                    return new TextDecoder().decode(pt);
                } catch (e) { return null; } // 解码或解密失败=格式不对/被篡改/密钥不符
            }
        };

        document.addEventListener('DOMContentLoaded', async function() {
            // 读取会话（sessionStorage 是登录时存入的，标签页关闭即失效）
            const myId = sessionStorage.getItem('static_id');
            const myName = sessionStorage.getItem('static_name') || myId;
            const myToken = sessionStorage.getItem('static_token');
            const myHash = sessionStorage.getItem('static_hash');

            // 未登录 → 回登录页
            if (!myId || !myToken) {
                window.location.href = 'login.html';
                return;
            }

            // 左上角显示自己的身份（头像先用名字首字符占位）
            document.getElementById('me-name').textContent = myName;
            document.getElementById('profile-link').href = 'user.html?id=' + encodeURIComponent(myId);
            document.getElementById('me-id').textContent = '@' + myId;
            const meAvatar = document.getElementById('me-avatar');
            meAvatar.textContent = (myName || '@').charAt(0).toUpperCase();

            // ---------- 侧边栏 ----------
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebar-overlay');

            function openSidebar() {
                sidebar.classList.add('open');
                sidebarOverlay.classList.add('show');
            }
            function closeSidebar() {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('show');
            }
            meAvatar.addEventListener('click', openSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);
            document.getElementById('sidebar-close').addEventListener('click', closeSidebar);

            // ---------- 资料拉取（自己的 + 联系人的，全部来自服务器，保证改名/换头像后同步） ----------
            async function fetchProfile(id) {
                try {
                    const res = await fetch('/api/profile?id=' + encodeURIComponent(id));
                    const data = await res.json();
                    if (data.ok) return { name: data.name, avatar: data.avatar };
                } catch (e) {}
                return null;
            }

            // 自己的资料 → 更新左上角名字和头像
            fetchProfile(myId).then(p => {
                if (p) {
                    document.getElementById('me-name').textContent = p.name;
                    if (p.avatar) {
                        meAvatar.textContent = '';
                        meAvatar.style.backgroundImage = 'url(' + p.avatar + ')';
                        meAvatar.classList.add('has-img');
                    }
                }
            });

            // 未读请求角标：白色圆圈数字，仅统计「看过之后」新来的未处理请求
            const SEEN_KEY = 'static_seen_incoming_' + myId;
            function getSeenTs() {
                try {
                    const v = parseInt(localStorage.getItem(SEEN_KEY), 10);
                    return isNaN(v) ? 0 : v;
                } catch (e) { return 0; }
            }
            function markSeen() {
                try { localStorage.setItem(SEEN_KEY, String(Date.now())); } catch (e) {}
            }
            function updateBadge(incoming) {
                const badge = document.getElementById('add-badge');
                if (!badge) return;
                const seen = getSeenTs();
                const unread = (incoming || []).filter(r => r && r.ts && r.ts > seen).length;
                if (unread > 0) {
                    badge.textContent = unread > 99 ? '99+' : String(unread);
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            }

            // 码表：我的好友列表（来自 /api/contacts，先「添加好友」才会出现）
            const listEl = document.getElementById('contact-list');

            const cardEntries = []; // { card, name }，搜索时按名字匹配度重排

            let allIds = [];
            try {
                const res = await fetch('/api/contacts?token=' + encodeURIComponent(myToken));
                const data = await res.json();
                if (data.ok) {
                    if (Array.isArray(data.contacts)) allIds = data.contacts;
                    updateBadge(data.incoming);
                }
            } catch (e) {}

            // 空状态：还没有好友时给出提示
            if (allIds.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'add-empty';
                empty.textContent = '还没有好友，点右上角 + 添加';
                listEl.appendChild(empty);
            }

            allIds.filter(id => id !== myId).forEach(id => {
                const card = document.createElement('a');
                card.className = 'contact-card';
                card.href = 'chat.html?peer=' + encodeURIComponent(id);

                // 头像占位（拉到资料后替换）
                const avatar = document.createElement('div');
                avatar.className = 'contact-avatar';
                avatar.textContent = '@';
                card.appendChild(avatar);

                const info = document.createElement('div');
                info.className = 'contact-info';
                const nameEl = document.createElement('div');
                nameEl.className = 'contact-name';
                nameEl.textContent = '@' + id;
                const idEl = document.createElement('div');
                idEl.className = 'contact-id';
                idEl.textContent = '@' + id;
                info.appendChild(nameEl);
                info.appendChild(idEl);
                card.appendChild(info);

                listEl.appendChild(card);

                const entry = { card: card, name: '@' + id };
                cardEntries.push(entry);

                // 从服务器拉取对方最新资料
                fetchProfile(id).then(p => {
                    if (p) {
                        nameEl.textContent = p.name;
                        entry.name = p.name;
                        if (p.avatar) {
                            avatar.textContent = '';
                            avatar.style.backgroundImage = 'url(' + p.avatar + ')';
                            avatar.classList.add('has-img');
                        } else {
                            avatar.textContent = p.name.charAt(0).toUpperCase();
                        }
                    }
                    // 认证标记（在名字定稿之后插入，避免被 textContent 覆盖清掉）
                    VerifiedBadge.attach(nameEl, id);
                });
            });

            // ---------- 搜索：把名字最匹配的用户排到最上面 ----------
            const searchInput = document.getElementById('contact-search');

            function matchScore(name, q) {
                const n = name.toLowerCase();
                if (n === q) return 4;          // 完全一致
                if (n.startsWith(q)) return 3;  // 开头匹配
                if (n.indexOf(q) !== -1) return 2; // 包含
                // 模糊：搜索的每个字符都出现在名字里
                let all = true;
                for (const ch of q) {
                    if (n.indexOf(ch) === -1) { all = false; break; }
                }
                return all ? 1 : 0;
            }

            function doSearch() {
                const q = searchInput.value.trim().toLowerCase();
                if (!q) {
                    // 空搜索恢复原顺序
                    cardEntries.forEach(e => listEl.appendChild(e.card));
                    return;
                }
                cardEntries
                    .map((e, i) => ({ e: e, i: i, score: matchScore(e.name, q) }))
                    .sort((a, b) => b.score - a.score || a.i - b.i)
                    .forEach(s => listEl.appendChild(s.e.card));
            }

            document.getElementById('search-btn').addEventListener('click', doSearch);
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') doSearch();
            });

            // ---------- 下拉阻尼回弹（只有联系人列表动，搜索框不动） ----------
            const scroller = document.querySelector('.static-content');
            const contactList = document.getElementById('contact-list');
            let pullStartY = 0, pulling = false;

            scroller.addEventListener('touchstart', function(e) {
                pulling = true;
                pullStartY = e.touches[0].clientY;
                contactList.style.transition = 'none';
            }, { passive: true });

            scroller.addEventListener('touchmove', function(e) {
                if (!pulling) return;
                const dy = e.touches[0].clientY - pullStartY;
                if (dy > 0 && scroller.scrollTop <= 0) {
                    // 阻尼：位移随拉动距离递减，越拉越沉
                    const offset = Math.pow(dy, 0.75);
                    contactList.style.transform = 'translateY(' + offset + 'px)';
                    e.preventDefault();
                }
            }, { passive: false });

            function springBack() {
                if (!pulling) return;
                pulling = false;
                contactList.style.transition = 'transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.1)';
                contactList.style.transform = '';
            }
            scroller.addEventListener('touchend', springBack);
            scroller.addEventListener('touchcancel', springBack);

            // ---------- Prism 悬浮聊天框 ----------
            const PRISM_SVG = '<svg viewBox="0 0 512 512"><g stroke-linejoin="round" stroke-linecap="round"><path d="M256,256 L89.72,160 L256,64 L422.28,160 Z" fill="#D9DEE4"/><path d="M256,256 L256,448 L89.72,352 L89.72,160 Z" fill="#7A818B"/><path d="M256,256 L422.28,160 L422.28,352 L256,448 Z" fill="#343A42"/><g stroke="var(--fg)" stroke-width="18" fill="none"><line x1="256" y1="256" x2="89.72" y2="160"/><line x1="256" y1="256" x2="422.28" y2="160"/><line x1="256" y1="256" x2="256" y2="448"/></g><path d="M256,64 L422.28,160 L422.28,352 L256,448 L89.72,352 L89.72,160 Z" fill="none" stroke="var(--fg)" stroke-width="22"/></g></svg>';

            const prismPanel = document.getElementById('prism-panel');
            const prismOverlay = document.getElementById('prism-overlay');
            const prismCloseBtn = document.getElementById('prism-close');
            const prismLog = document.getElementById('prism-log');
            const prismInput = document.getElementById('prism-input');
            const prismSendBtn = document.getElementById('prism-send');
            const prismStatus = document.getElementById('prism-status');
            document.getElementById('prism-head-icon').innerHTML = PRISM_SVG;
            document.getElementById('model-lock').innerHTML = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

            // 对话历史存 sessionStorage（关标签页即清，AI 对话不需要持久化）
            const PRISM_KEY = 'prism_history_' + myId;
            let prismHistory = [];
            try { prismHistory = JSON.parse(sessionStorage.getItem(PRISM_KEY)) || []; } catch (e) {}

            function openPrism() {
                prismPanel.classList.add('open');
                prismOverlay.classList.add('show');
                renderPrism();
            }
            function closePrism() {
                prismPanel.classList.remove('open');
                prismOverlay.classList.remove('show');
            }

            document.querySelector('.prism-entry').addEventListener('click', openPrism);
            prismOverlay.addEventListener('click', closePrism);
            prismCloseBtn.addEventListener('click', closePrism);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closePrism();
            });

            // ---------- 消息渲染（与用户间聊天同款：头像+文字+时间+会话线） ----------
            function prismAvatarEl(isMine) {
                const el = document.createElement('div');
                el.className = 'pmsg-avatar';
                if (isMine) {
                    // 我的头像（左上角资料已拉到）
                    if (meAvatar.classList.contains('has-img')) {
                        el.style.backgroundImage = meAvatar.style.backgroundImage;
                        el.classList.add('has-img');
                    } else {
                        el.textContent = (myName || '@').charAt(0).toUpperCase();
                    }
                } else {
                    // prism 的立方体
                    el.innerHTML = PRISM_SVG;
                    el.classList.add('prism-cube');
                }
                return el;
            }

            function renderPrism() {
                prismLog.innerHTML = '';
                prismHistory.forEach((m, idx) => {
                    const isMine = m.role === 'user';
                    const row = document.createElement('div');
                    row.className = 'pmsg-row ' + (isMine ? 'mine' : 'theirs');

                    // 连续消息：灰竖线串联（X 式会话线）
                    const next = prismHistory[idx + 1];
                    if (next && next.role === m.role) row.classList.add('continued');

                    row.appendChild(prismAvatarEl(isMine));

                    const col = document.createElement('div');
                    col.className = 'pmsg-col';
                    const textEl = document.createElement('div');
                    textEl.className = 'pmsg-text';
                    textEl.textContent = m.content;
                    const timeEl = document.createElement('div');
                    timeEl.className = 'pmsg-time';
                    const d = new Date(m.ts);
                    timeEl.textContent = (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
                        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
                    col.appendChild(textEl);
                    col.appendChild(timeEl);
                    row.appendChild(col);
                    prismLog.appendChild(row);
                });
                prismLog.scrollTop = prismLog.scrollHeight;
            }

            // ---------- 发送与接收 ----------
            async function prismSend() {
                const text = prismInput.value.trim();
                if (!text || prismSendBtn.disabled) return;

                prismHistory.push({ role: 'user', content: text, ts: Date.now() });
                savePrismHistory();
                renderPrism();
                prismInput.value = '';
                prismInput.focus();

                prismSendBtn.disabled = true;
                prismStatus.textContent = '...';
                try {
                    const res = await fetch('/api/ai', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: myToken, messages: prismHistory.map(m => ({ role: m.role, content: m.content })) })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        prismHistory.push({ role: 'assistant', content: data.reply, ts: Date.now() });
                        savePrismHistory();
                        renderPrism();
                        prismStatus.textContent = '';
                    } else if (res.status === 401) {
                        prismStatus.textContent = '登录已过期';
                    } else {
                        prismStatus.textContent = data.message || '请求失败';
                    }
                } catch (e) {
                    prismStatus.textContent = '网络异常';
                }
                prismSendBtn.disabled = false;
            }

            function savePrismHistory() {
                try {
                    sessionStorage.setItem(PRISM_KEY, JSON.stringify(prismHistory.slice(-40)));
                } catch (e) {}
            }

            prismSendBtn.addEventListener('click', prismSend);
            prismInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.isComposing) {
                    e.preventDefault();
                    prismSend();
                }
            });

            // ---------- 添加好友浮窗 ----------
            const addPanel = document.getElementById('add-panel');
            const addOverlay = document.getElementById('add-overlay');
            const addCloseBtn = document.getElementById('add-close');
            const addSearchInput = document.getElementById('add-search');
            const addSearchBtn = document.getElementById('add-search-btn');
            const addSearchResults = document.getElementById('add-search-results');
            const addIncoming = document.getElementById('add-incoming');
            const addOutgoing = document.getElementById('add-outgoing');

            function openAdd() {
                closePrism();
                addPanel.classList.add('open');
                addOverlay.classList.add('show');
                addSearchInput.value = '';
                addSearchResults.innerHTML = '';
                markSeen();
                updateBadge([]);
                loadAddState();
            }
            function closeAdd() {
                addPanel.classList.remove('open');
                addOverlay.classList.remove('show');
            }

            document.querySelector('.add-entry').addEventListener('click', openAdd);
            addOverlay.addEventListener('click', closeAdd);
            addCloseBtn.addEventListener('click', closeAdd);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeAdd();
            });

            // 拉取并渲染 收到的请求 + 已发送
            async function loadAddState() {
                try {
                    const res = await fetch('/api/contacts?token=' + encodeURIComponent(myToken));
                    const data = await res.json();
                    if (!data.ok) return;
                    renderIncoming(data.incoming || []);
                    renderOutgoing(data.outgoing || []);
                } catch (e) {}
            }

            // 构造一行用户（头像 + 名字/ID + 右侧操作区）
            function makeUserRow(id, name, actionHtml) {
                const row = document.createElement('div');
                row.className = 'add-user-row';
                const avatar = document.createElement('div');
                avatar.className = 'add-user-avatar';
                avatar.textContent = (name || '@' + id).charAt(0).toUpperCase();
                const info = document.createElement('div');
                info.className = 'add-user-info';
                const nameEl = document.createElement('div');
                nameEl.className = 'add-user-name';
                nameEl.textContent = name || ('@' + id);
                const idEl = document.createElement('div');
                idEl.className = 'add-user-id';
                idEl.textContent = '@' + id;
                info.appendChild(nameEl);
                info.appendChild(idEl);
                row.appendChild(avatar);
                row.appendChild(info);
                const action = document.createElement('div');
                action.className = 'add-user-action';
                action.innerHTML = actionHtml;
                row.appendChild(action);
                return row;
            }

            // 拉取用户资料（昵称 + 头像）
            async function loadUserProfile(id) {
                try {
                    const res = await fetch('/api/profile?id=' + encodeURIComponent(id));
                    const data = await res.json();
                    if (data.ok) return { name: data.name, avatar: data.avatar };
                } catch (e) {}
                return null;
            }

            // 用资料回填已渲染的行（昵称 + 头像）
            function fillUserRow(row, name, avatar) {
                if (!name) return;
                const avatarEl = row.querySelector('.add-user-avatar');
                const nameEl = row.querySelector('.add-user-name');
                if (nameEl) nameEl.textContent = name;
                if (avatarEl) {
                    if (avatar) {
                        avatarEl.textContent = '';
                        avatarEl.style.backgroundImage = 'url(' + avatar + ')';
                    } else {
                        avatarEl.style.backgroundImage = '';
                        avatarEl.textContent = name.charAt(0).toUpperCase();
                    }
                }
            }

            function renderIncoming(incoming) {
                addIncoming.innerHTML = '';
                if (!incoming.length) {
                    const empty = document.createElement('div');
                    empty.className = 'add-empty';
                    empty.textContent = '暂无';
                    addIncoming.appendChild(empty);
                    return;
                }
                incoming.forEach(req => {
                    const from = req && req.from;
                    if (!from) return;
                    const row = makeUserRow(from, null,
                        '<button class="add-action-btn" data-act="accept" data-id="' + from + '">同意</button>' +
                        '<button class="add-action-btn" data-act="reject" data-id="' + from + '">拒绝</button>');
                    addIncoming.appendChild(row);
                    loadUserProfile(from).then(p => {
                        if (p) fillUserRow(row, p.name, p.avatar);
                        VerifiedBadge.attach(row.querySelector('.add-user-name'), from);
                    });
                });
            }

            function renderOutgoing(outgoing) {
                addOutgoing.innerHTML = '';
                if (!outgoing.length) {
                    const empty = document.createElement('div');
                    empty.className = 'add-empty';
                    empty.textContent = '暂无';
                    addOutgoing.appendChild(empty);
                    return;
                }
                outgoing.forEach(id => {
                    const row = makeUserRow(id, null, '<span style="font-size:12px;color:var(--text-dim)">等待处理</span>');
                    addOutgoing.appendChild(row);
                    loadUserProfile(id).then(p => {
                        if (p) fillUserRow(row, p.name, p.avatar);
                    });
                });
            }

            // 处理收到的请求（同意 / 拒绝），事件委托
            addIncoming.addEventListener('click', async function(e) {
                const btn = e.target.closest('.add-action-btn');
                if (!btn) return;
                const act = btn.getAttribute('data-act');
                const id = btn.getAttribute('data-id');
                btn.disabled = true;
                try {
                    const res = await fetch('/api/contacts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: myToken, targetId: id, action: act })
                    });
                    if (res.status === 401) { window.location.href = 'login.html'; return; }
                    await loadAddState();
                    if (act === 'accept') location.reload();
                } catch (e) { btn.disabled = false; }
            });

            // 搜索用户
            async function doAddSearch() {
                const q = addSearchInput.value.trim();
                if (!q) return;
                addSearchResults.innerHTML = '<div class="add-empty">搜索中…</div>';
                try {
                    const res = await fetch('/api/users?token=' + encodeURIComponent(myToken) + '&q=' + encodeURIComponent(q));
                    const data = await res.json();
                    if (res.status === 401) { window.location.href = 'login.html'; return; }
                    if (!data.ok || !Array.isArray(data.users) || !data.users.length) {
                        addSearchResults.innerHTML = '<div class="add-empty">没有找到匹配的用户</div>';
                        return;
                    }
                    addSearchResults.innerHTML = '';
                data.users.forEach(u => {
                    if (u.id === myId) return; // 不显示自己
                    const row = makeUserRow(u.id, u.name,
                        '<button class="add-action-btn" data-add="' + u.id + '">添加</button>');
                    addSearchResults.appendChild(row);
                    loadUserProfile(u.id).then(p => {
                        if (p) fillUserRow(row, p.name, p.avatar);
                        VerifiedBadge.attach(row.querySelector('.add-user-name'), u.id);
                    });
                });
                } catch (e) {
                    addSearchResults.innerHTML = '<div class="add-empty">网络异常</div>';
                }
            }
            addSearchBtn.addEventListener('click', doAddSearch);
            addSearchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.isComposing) {
                    e.preventDefault();
                    doAddSearch();
                }
            });

            // 发起好友请求
            addSearchResults.addEventListener('click', async function(e) {
                const btn = e.target.closest('[data-add]');
                if (!btn) return;
                const id = btn.getAttribute('data-add');
                btn.disabled = true;
                btn.textContent = '发送中…';
                try {
                    const res = await fetch('/api/contacts', {

                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: myToken, targetId: id })
                    });
                    if (res.status === 401) { window.location.href = 'login.html'; return; }
                    const data = await res.json();

                        else if (data.already) { btn.textContent = '已是好友'; }
                        else if (data.pending) { btn.textContent = '等待处理'; }
                        else { btn.textContent = '已发送'; }
                        await loadAddState();
                    } else {

                        btn.disabled = false;
                    }
                } catch (e) {

                    btn.disabled = false;
                }

<body>
    <a class="back-link" href="index.html">&larr; index</a>

    <div class="me-info">
        <div class="me-avatar" id="me-avatar" title="个人资料">@</div>
        <div class="me-text">
            <div class="me-name" id="me-name"></div>
            <div class="me-id" id="me-id"></div>
        </div>
    </div>

    <!-- 右上角 添加好友 入口 -->
    <div class="add-entry" title="添加好友" aria-label="添加好友">
        <svg viewBox="0 0 1024 1024" fill="none" stroke="var(--fg)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
            <g transform="translate(-42, 88)">
                <circle cx="380" cy="320" r="96"/>
                <path d="M216 664 A164 164 0 0 1 544 664"/>
                <circle cx="736" cy="400" r="76"/>
                <path d="M616 680 A120 120 0 0 1 856 680"/>
                <path d="M892 138 V322"/>
                <path d="M800 230 H984"/>
            </g>
        </svg>
        <span class="add-badge" id="add-badge"></span>
    </div>

    <!-- 右上角 prism 入口 -->
    <div class="prism-entry" title="prism" aria-label="prism">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <g stroke-linejoin="round" stroke-linecap="round">
                <path d="M 256.00,256.00 L 89.72,160.00 L 256.00,64.00 L 422.28,160.00 Z" fill="#D9DEE4" stroke="none"/>
                <path d="M 256.00,256.00 L 256.00,448.00 L 89.72,352.00 L 89.72,160.00 Z" fill="#7A818B" stroke="none"/>
                <path d="M 256.00,256.00 L 422.28,160.00 L 422.28,352.00 L 256.00,448.00 Z" fill="#343A42" stroke="none"/>
                <g stroke="var(--fg)" stroke-width="18.0" fill="none">
                    <line x1="256.00" y1="256.00" x2="89.72" y2="160.00"/>
                    <line x1="256.00" y1="256.00" x2="422.28" y2="160.00"/>
                    <line x1="256.00" y1="256.00" x2="256.00" y2="448.00"/>
                </g>
                <path d="M 256.00,64.00 L 422.28,160.00 L 422.28,352.00 L 256.00,448.00 L 89.72,352.00 L 89.72,160.00 Z" fill="none" stroke="var(--fg)" stroke-width="22.0"/>
            </g>
        </svg>
    </div>

    <!-- Prism 悬浮聊天框（点右上角图标弹出） -->
    <div class="prism-overlay" id="prism-overlay"></div>
    <div class="prism-panel" id="prism-panel">
        <div class="prism-head">
            <div class="prism-head-icon" id="prism-head-icon"></div>
            <div class="prism-head-text">
                <div class="prism-head-name">棱镜</div>
                <div class="prism-head-id">Prism</div>
            </div>
            <div class="model-tag" title="当前唯一可用模型">
                <span id="model-lock"></span>GLM-4.7-Flash
            </div>
            <button class="prism-close" id="prism-close" type="button">&times;</button>
        </div>
        <div class="prism-log" id="prism-log"></div>
        <div class="prism-status" id="prism-status"></div>
        <div class="prism-input-bar">
            <input type="text" class="prism-input" id="prism-input" placeholder="" autocomplete="off" maxlength="2000">
            <button class="prism-send" id="prism-send" type="button" title="发送" aria-label="发送">
                <svg viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 18 L8 2 M3 7 L8 2 L13 7"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- 添加好友浮窗 -->
    <div class="add-overlay" id="add-overlay"></div>
    <div class="add-panel" id="add-panel">
        <div class="add-head">
            <div class="add-head-icon">
                <svg viewBox="0 0 1024 1024" fill="none" stroke="var(--fg)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
                    <g transform="translate(-42, 88)">
                        <circle cx="380" cy="320" r="96"/>
                        <path d="M216 664 A164 164 0 0 1 544 664"/>
                        <circle cx="736" cy="400" r="76"/>
                        <path d="M616 680 A120 120 0 0 1 856 680"/>
                        <path d="M892 138 V322"/>
                        <path d="M800 230 H984"/>
                    </g>
                </svg>
            </div>
            <div class="add-head-text">
                <div class="add-head-name">添加好友</div>
                <div class="add-head-id">Add friend</div>
            </div>
            <button class="add-close" id="add-close" type="button">&times;</button>
        </div>
        <div class="add-body">
            <div class="add-search-bar">
                <input type="text" class="add-search-input" id="add-search" placeholder="搜索 ID 或昵称" autocomplete="off" maxlength="20">
                <button type="button" class="add-search-btn" id="add-search-btn">搜索</button>
            </div>
            <div id="add-search-results"></div>
            <div class="add-section-label">收到的请求</div>
            <div id="add-incoming"></div>
            <div class="add-section-label">已发送</div>
            <div id="add-outgoing"></div>
        </div>
    </div>

    <!-- 侧边栏（点头像弹出） -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="sidebar" id="sidebar">
        <button class="sidebar-close" id="sidebar-close" type="button">&times;</button>
        <a class="sidebar-item" id="profile-link" href="#">个人资料</a>
        <button class="sidebar-item sidebar-logout" id="logout-sidebar-btn" type="button">退出登录</button>
    </div>

    <div class="static-content">
        <div class="search-bar">
            <input type="text" class="search-input" id="contact-search" placeholder="" autocomplete="off">
            <button type="button" class="search-btn" id="search-btn" title="搜索" aria-label="搜索">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" d="M10.5 3a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/>
                    <path d="M15.9 15.9 L21 21 a1 1 0 0 1-1.4 1.4 L14.5 17.3 a1 1 0 0 1 1.4-1.4z"/>
                </svg>
            </button>
        </div>
        <div class="contact-list" id="contact-list"></div>
    </div>

    <!-- 底部栏：竖线一分为二，左 chat 入口，右留空 -->
    <div class="bottom-bar">
        <a class="bar-tab" href="static.html" title="chat" aria-label="chat">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 4h16v12H8l-4 4z"/>
            </svg>
        </a>
        <a class="bar-tab" href="plaza.html" title="plaza" aria-label="plaza">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                <path d="M4.93 19.07a10 10 0 0 1 0-14.14"/>
                <path d="M17 7a7.3 7.3 0 0 1 0 10"/>
                <path d="M7 17a7.3 7.3 0 0 1 0-10"/>
                <path d="M12 8 L13.4 10.6 L16 12 L13.4 13.4 L12 16 L10.6 13.4 L8 12 L10.6 10.6 Z"/>
            </svg>
        </a>
    </div>
</body>
</html>
