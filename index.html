<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wangwang-momo</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><text x='50' y='65' font-size='60' fill='%23ffffff' text-anchor='middle' font-family='cursive'>i</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            background: #000000;
            font-family: Arial, sans-serif;
        }

        /* 顶部提示语 */
        .select-hint {
            text-align: center;
            padding: 28px 16px 0;
            flex-shrink: 0;
        }

        .select-hint span {
            font-size: 13px;
            color: #888888;
            letter-spacing: 3px;
        }

        /* 上下两半屏（只是布局容器，不可点击） */
        .half {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
        }

        /* 中间的白色横线 */
        .divider {
            height: 1px;
            background: #ffffff;
            flex-shrink: 0;
        }

        /* 模块入口：白色矩形框本身才是链接 */
        .module-link {
            text-decoration: none;
            display: inline-block;
        }

        .module-box {
            border: 1px solid #ffffff;
            padding: 18px 56px;
            transition: all 0.3s ease;
        }

        .module-box span {
            font-size: 34px;
            font-weight: 700;
            font-style: italic;
            color: #ffffff;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .module-link:hover .module-box {
            background: #ffffff;
        }

        .module-link:hover .module-box span {
            color: #000000;
        }

        /* 框下的说明 */
        .module-desc {
            margin-top: 18px;
            font-size: 13px;
            color: #888888;
            line-height: 1.7;
            text-align: center;
            max-width: 340px;
        }

        /* 页尾声明 */
        .site-footer {
            text-align: center;
            padding: 14px 16px 18px;
            flex-shrink: 0;
        }

        .copyright {
            font-size: 13px;
            color: #888888;
            font-style: italic;
            font-weight: bold;
            line-height: 1.6;
        }

        .copyright-zh {
            margin-bottom: 4px;
        }

        @media (max-width: 768px) {
            .select-hint {
                padding: 20px 16px 0;
            }

            .select-hint span {
                font-size: 11px;
                letter-spacing: 2px;
            }

            .module-box {
                padding: 14px 40px;
            }

            .module-box span {
                font-size: 26px;
            }

            .module-desc {
                margin-top: 14px;
                font-size: 12px;
                max-width: 280px;
            }

            .copyright {
                font-size: 11px;
                line-height: 1.5;
            }
        }
    </style>
</head>
<body>
    <div class="select-hint"><span>请选择您想要使用的模块</span></div>

    <div class="half">
        <a class="module-link" href="search.html">
            <div class="module-box"><span>index</span></div>
        </a>
        <div class="module-desc">基于 Microsoft Bing 的搜索窗口</div>
    </div>

    <div class="divider"></div>

    <div class="half">
        <a class="module-link" href="login.html">
            <div class="module-box"><span>Static</span></div>
        </a>
        <div class="module-desc">面向注册成员的加密通讯模块。消息经端到端加密传输与存储，仅对话双方可见。</div>
    </div>

    <div class="site-footer">
        <div class="copyright copyright-zh">版权所有 &copy; 2026 任继锋、汪子雯 保留所有权利。</div>
        <div class="copyright">Copyright &copy; 2026 Ren Jifeng &amp; Wang Ziwen. All rights reserved.</div>
    </div>
</body>
</html>
