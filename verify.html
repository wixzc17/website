    <style>
        * {
            margin: 0;
            padding: 0;

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000000;
            font-family: Arial, sans-serif;

            margin: 0 auto;

        }

        .verify-header {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin-bottom: 16px;
            border-bottom: 1px solid #333333;
            padding-bottom: 18px;
        }

        .verify-title {
            font-size: 32px;
            font-weight: 700;
            font-style: italic;
            color: #ffffff;

            line-height: 1;
        }

        .verify-sub {
            font-size: 14px;
            color: #666666;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .verify-desc {
            color: #999999;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 32px;
        }

        /* 三档：移动端竖排（默认），PC 端 ≥900px 横排 */
        .tier-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 900px) {
            .tier-grid {
                flex-direction: row;
            }

            .tier {
                flex: 1 1 0;
                min-width: 0;
            }
        }

        .tier {
            border: 1px solid #ffffff;
            padding: 22px 20px;
        }

        .tier-name {
            font-size: 22px;
            font-weight: 700;
            font-style: italic;
            color: #ffffff;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', 'Monaco', 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .tier-price {
            margin-top: 10px;
            font-size: 18px;
            color: #ffffff;
            font-style: italic;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        .tier-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .tier-btn {
            flex: 1 1 140px;
            padding: 8px 14px;
            border: 1px solid #ffffff;
            background: transparent;
            color: #ffffff;
            font-size: 13px;
            letter-spacing: 1px;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .tier-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        /* 权限列表：每条前面一条灰色短横线（与 changelog 一致） */
        .tier-list {
            list-style: none;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #333333;
        }

        .tier-list li {
            padding-left: 16px;
            position: relative;
            margin-bottom: 8px;
            color: #cccccc;
            font-size: 14px;
            line-height: 1.6;
        }

        .tier-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 11px;
            width: 6px;
            height: 1px;
            background: #666666;
        }

        .tier-soon {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #333333;
            color: #666666;
            font-size: 13px;
            line-height: 1.8;
        }

        .verify-note {
            margin-top: 28px;
            min-height: 20px;
            color: #666666;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .back-link {
            position: fixed;
            top: 16px;
            left: 20px;
            font-size: 13px;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .footer {
            text-align: center;
            padding: 20px;
        }

        .copyright {
            font-size: 14px;
            color: #888888;
            font-style: italic;
            font-weight: bold;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .verify-content {
                padding: 56px 20px 30px;
            }

            .verify-title {
                font-size: 26px;
            }

            .back-link {
                top: 10px;
                left: 12px;
                font-size: 11px;
            }

            .copyright {
                font-size: 12px;
                line-height: 1.4;
            }
        }
    </style>
