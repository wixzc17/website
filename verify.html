<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static · 认证</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><text x='50' y='65' font-size='60' fill='%23ffffff' text-anchor='middle' font-family='cursive'>i</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            font-family: Arial, sans-serif;
        }

        .verify-content {
            flex: 1;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 70px 20px 40px;
        }

        .verify-header {
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 18px;
        }

        .verify-title {
            font-size: 20px;
            color: var(--fg);
            letter-spacing: 2px;
            line-height: 1;
        }

        .verify-desc {
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 32px;
        }

        /* 三档：移动端竖排（默认），PC 端 ≥900px 横排 */
        .tier-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 900px) {
            .tier-grid {
                flex-direction: row;
            }

            .tier {
                flex: 1 1 0;
                min-width: 0;
            }
        }

        .tier {
            border: 1px solid var(--fg);
            padding: 22px 20px;
        }

        .tier-name {
            font-size: 22px;
            font-weight: 700;
            font-style: italic;
            color: var(--fg);
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', 'Monaco', 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .tier-price {
            margin-top: 10px;
            font-size: 18px;
            color: var(--fg);
            font-style: italic;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        .tier-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .tier-btn {
            flex: 1 1 140px;
            padding: 8px 14px;
            border: 1px solid var(--fg);
            background: transparent;
            color: var(--fg);
            font-size: 13px;
            letter-spacing: 1px;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .tier-btn:hover {
            background: var(--fg);
            color: var(--bg);
        }

        /* 权限列表：每条前面一条灰色短横线（与 changelog 一致） */
        .tier-list {
            list-style: none;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
        }

        .tier-list li {
            padding-left: 16px;
            position: relative;
            margin-bottom: 8px;
            color: var(--text-body);
            font-size: 14px;
            line-height: 1.6;
        }

        .tier-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 11px;
            width: 6px;
            height: 1px;
            background: var(--text-dim);
        }

        .tier-soon {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 13px;
            line-height: 1.8;
        }

        .verify-note {
            margin-top: 28px;
            min-height: 20px;
            color: var(--text-dim);
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .back-link {
            position: fixed;
            top: 16px;
            left: 20px;
            font-size: 13px;
            color: var(--fg);
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .footer {
            text-align: center;
            padding: 20px;
        }

        .copyright {
            font-size: 14px;
            color: var(--text-mid);
            font-style: italic;
            font-weight: bold;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .verify-content {
                padding: 56px 20px 30px;
            }

            .verify-title {
                font-size: 18px;
            }

            .back-link {
                top: 10px;
                left: 12px;
                font-size: 11px;
            }

            .copyright {
                font-size: 12px;
                line-height: 1.4;
            }
        }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="/icon-512.png">
</head>
<body>
    <a class="back-link" href="static.html" id="back-link">← Static</a>

    <div class="verify-content">
        <div class="verify-header">
            <div class="verify-title">认证计划</div>
        </div>

        <p class="verify-desc">认证账号会在名字旁显示可信标记，并解锁更多能力。选择适合你的级别。</p>

        <div class="tier-grid">
            <section class="tier">
                <div class="tier-name">Base</div>
                <div class="tier-price">9.9¥/月</div>
                <div class="tier-actions">
                    <button class="tier-btn" data-cta="subscribe">订阅</button>
                    <button class="tier-btn" data-cta="apply">向官方申请</button>
                </div>
                <ul class="tier-list">
                    <li>认证标记</li>
                    <li>好友栏位上限 500</li>
                    <li>可以发送推文</li>
                    <li>可以对推文点赞与评论</li>
                </ul>
            </section>

            <section class="tier">
                <div class="tier-name">Turbo</div>
                <div class="tier-soon">还在开发中</div>
            </section>

            <section class="tier">
                <div class="tier-name">Pro</div>
                <div class="tier-soon">还在开发中</div>
            </section>
        </div>

        <p class="verify-note" id="verify-note"></p>
    </div>

    <div class="footer">
        <div class="copyright">Copyright &copy; 2026 Ren Jifeng &amp; Wang Ziwen. All rights reserved.</div>
    </div>

    <script>
        // 返回：有历史则后退，否则回码表
        // 内联 onclick 里的 history.length>1 的「>」会被 HTML 注入器误判为标签结束，
        // 导致「出现代码」，故改用脚本绑定
        document.getElementById('back-link').addEventListener('click', function(e) {
            if (history.length > 1) { e.preventDefault(); history.back(); }
        });

        // 两个按钮先只做壳：支付与申请流程后续接入，这里只给反馈不跳转
        document.querySelectorAll('.tier-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                const isSubscribe = btn.getAttribute('data-cta') === 'subscribe';
                document.getElementById('verify-note').textContent =
                    isSubscribe ? '订阅通道正在接入中，敬请期待' : '申请通道正在接入中，敬请期待';
            });
        });
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function(){});
    }
    </script>
</body>
</html>
