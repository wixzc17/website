<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static · 对话</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><text x='50' y='65' font-size='60' fill='%23ffffff' text-anchor='middle' font-family='cursive'>i</text></svg>">
    <script>
        // 共享加密工具（与 static.html 保持一致的派生方式）
        const StaticCrypto = {
            async deriveKey(myId, peerId, passwordHash) {
                const material = [myId, peerId].sort().join('::') + '::' + passwordHash;
                const raw = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(material));
                return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
            },
            async encrypt(key, plaintext) {
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(plaintext));
                return btoa(String.fromCharCode(...iv)) + '.' + btoa(String.fromCharCode(...new Uint8Array(ct)));
            },
            async decrypt(key, payload) {
                const parts = payload.split('.');
                if (parts.length !== 2) return null;
                const iv = Uint8Array.from(atob(parts[0]), c => c.charCodeAt(0));
                const ct = Uint8Array.from(atob(parts[1]), c => c.charCodeAt(0));
                try {
                    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
                    return new TextDecoder().decode(pt);
                } catch (e) { return null; }
            }
        };

        document.addEventListener('DOMContentLoaded', async function() {
            // 会话信息
            const myId = sessionStorage.getItem('static_id');
            const myName = sessionStorage.getItem('static_name') || myId;
            const myToken = sessionStorage.getItem('static_token');
            const myHash = sessionStorage.getItem('static_hash');

            if (!myId || !myToken) {
                window.location.href = 'login.html';
                return;
            }

            // 对话对象
            const params = new URLSearchParams(window.location.search);
            const peerId = (params.get('peer') || '').replace(/^@/, '');
            const peerName = params.get('name') || ('@' + peerId);

            if (!/^[a-zA-Z0-9]+$/.test(peerId)) {
                window.location.href = 'static.html';
                return;
            }

            document.getElementById('peer-name').textContent = peerName;
            document.getElementById('peer-id').textContent = '@' + peerId;

            // 加密密钥（两人ID + 密码哈希派生）
            const key = await StaticCrypto.deriveKey(myId, peerId, myHash);

            // ---------- 界面元素 ----------
            const messagesEl = document.getElementById('messages');
            const inputEl = document.getElementById('msg-input');
            const sendBtn = document.getElementById('send-btn');
            const statusEl = document.getElementById('conn-status');

            let rendered = ''; // 已渲染的消息指纹，避免重复渲染
            let polling = null;

            // ---------- 消息渲染 ----------
            function renderMessages(messages) {
                const fingerprint = messages.length + ':' + (messages[messages.length - 1] ? messages[messages.length - 1].ts : 0);
                if (fingerprint === rendered) return;
                rendered = fingerprint;

                messagesEl.innerHTML = '';
                messages.forEach(async m => {
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble-row ' + (m.from === myId ? 'mine' : 'theirs');

                    const bubbleInner = document.createElement('div');
                    bubbleInner.className = 'bubble';

                    // 解密
                    const text = await StaticCrypto.decrypt(key, m.ct);
                    if (text === null) {
                        bubbleInner.textContent = '[无法解密的消息]';
                        bubbleInner.classList.add('undecryptable');
                    } else {
                        bubbleInner.textContent = text;
                    }

                    // 时间戳
                    const timeEl = document.createElement('div');
                    timeEl.className = 'bubble-time';
                    const d = new Date(m.ts);
                    timeEl.textContent = (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
                        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');

                    bubble.appendChild(bubbleInner);
                    bubble.appendChild(timeEl);
                    messagesEl.appendChild(bubble);
                });

                // 滚到底部
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            // ---------- 拉取消息（2秒轮询） ----------
            async function fetchMessages() {
                try {
                    const res = await fetch('/api/chat?token=' + encodeURIComponent(myToken) + '&peer=' + encodeURIComponent(peerId));
                    if (res.status === 401) {
                        clearInterval(polling);
                        statusEl.textContent = '登录已过期，请重新登录';
                        setTimeout(() => window.location.href = 'login.html', 2000);
                        return;
                    }
                    const data = await res.json();
                    if (data.ok) {
                        renderMessages(data.messages);
                        statusEl.textContent = '';
                    }
                } catch (e) {
                    statusEl.textContent = '连接中断，重试中...';
                }
            }

            polling = setInterval(fetchMessages, 2000);
            fetchMessages(); // 立即拉一次

            // ---------- 发送消息 ----------
            async function sendMessage() {
                const text = inputEl.value.trim();
                if (!text) return;

                sendBtn.disabled = true;
                try {
                    const ciphertext = await StaticCrypto.encrypt(key, text);
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: myToken, to: peerId, ciphertext: ciphertext })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        inputEl.value = '';
                        fetchMessages(); // 立即刷新
                    } else {
                        statusEl.textContent = data.message || '发送失败';
                    }
                } catch (e) {
                    statusEl.textContent = '网络异常，消息未发出';
                }
                sendBtn.disabled = false;
                inputEl.focus();
            }

            sendBtn.addEventListener('click', sendMessage);
            inputEl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.isComposing) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000000;
            font-family: Arial, sans-serif;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #262626;
            flex-shrink: 0;
        }

        .back-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            transition: opacity 0.3s ease;
            padding: 2px 8px;
        }

        .back-link:hover {
            opacity: 0.6;
        }

        .peer-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid #404040;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
        }

        .peer-info {
            display: flex;
            flex-direction: column;
        }

        .peer-name {
            font-size: 15px;
            color: #ffffff;
            font-weight: 700;
        }

        .peer-id {
            font-size: 11px;
            color: #666666;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bubble-row {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }

        .bubble-row.mine {
            align-self: flex-end;
            align-items: flex-end;
        }

        .bubble-row.theirs {
            align-self: flex-start;
            align-items: flex-start;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .mine .bubble {
            background: #ffffff;
            color: #000000;
            border-bottom-right-radius: 4px;
        }

        .theirs .bubble {
            background: #111111;
            color: #ffffff;
            border: 1px solid #333333;
            border-bottom-left-radius: 4px;
        }

        .bubble.undecryptable {
            color: #aa6666;
            font-style: italic;
        }

        .bubble-time {
            font-size: 10px;
            color: #555555;
            margin-top: 4px;
        }

        .chat-input-bar {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            border-top: 1px solid #262626;
            flex-shrink: 0;
        }

        .msg-input {
            flex: 1;
            border: 1px solid #404040;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 14px;
            background: #000000;
            color: #ffffff;
            outline: none;
            resize: none;
        }

        .msg-input:focus {
            border-color: #ffffff;
        }

        .send-btn {
            border: 1px solid #404040;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 14px;
            background: #000000;
            color: #ffffff;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .send-btn:hover:not(:disabled) {
            background: #ffffff;
            color: #000000;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .conn-status {
            font-size: 11px;
            color: #aa6666;
            text-align: center;
            min-height: 0;
            padding: 0;
        }

        @media (max-width: 768px) {
            .messages {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-header">
        <a class="back-link" href="static.html">&larr;</a>
        <div class="peer-avatar" id="peer-avatar-char"></div>
        <div class="peer-info">
            <div class="peer-name" id="peer-name"></div>
            <div class="peer-id" id="peer-id"></div>
        </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="conn-status" id="conn-status"></div>

    <div class="chat-input-bar">
        <input type="text" class="msg-input" id="msg-input" placeholder="输入消息..." autocomplete="off" maxlength="2000">
        <button class="send-btn" id="send-btn">发送</button>
    </div>

    <script>
        // 头像字符（放在最后的内联 script，确保 peerName 已设置）
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const avatarEl = document.getElementById('peer-avatar-char');
                const nameEl = document.getElementById('peer-name');
                if (avatarEl && nameEl && nameEl.textContent) {
                    avatarEl.textContent = nameEl.textContent.charAt(0).toUpperCase();
                }
            }, 0);
        });
    </script>
</body>
</html>
