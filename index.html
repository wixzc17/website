<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wangwang-momo</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><text x='50' y='65' font-size='60' fill='%23ffffff' text-anchor='middle' font-family='cursive'>i</text></svg>">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ---------- Prism（棱镜）匿名导览 ----------
            const PRISM_SVG = '<svg viewBox="0 0 512 512"><g stroke-linejoin="round" stroke-linecap="round"><path d="M256,256 L89.72,160 L256,64 L422.28,160 Z" fill="#D9DEE4"/><path d="M256,256 L256,448 L89.72,352 L89.72,160 Z" fill="#7A818B"/><path d="M256,256 L422.28,160 L422.28,352 L256,448 Z" fill="#343A42"/><g stroke="var(--fg)" stroke-width="18" fill="none"><line x1="256" y1="256" x2="89.72" y2="160"/><line x1="256" y1="256" x2="422.28" y2="160"/><line x1="256" y1="256" x2="256" y2="448"/></g><path d="M256,64 L422.28,160 L422.28,352 L256,448 L89.72,352 L89.72,160 Z" fill="none" stroke="var(--fg)" stroke-width="22"/></g></svg>';
            const LOCK_SVG = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

            const prismPanel = document.getElementById('prism-panel');
            const prismOverlay = document.getElementById('prism-overlay');
            const prismCloseBtn = document.getElementById('prism-close');
            const prismLog = document.getElementById('prism-log');
            const prismInput = document.getElementById('prism-input');
            const prismSendBtn = document.getElementById('prism-send');
            const prismStatus = document.getElementById('prism-status');
            const prismTurns = document.getElementById('prism-turns');

            document.getElementById('prism-head-icon').innerHTML = PRISM_SVG;
            document.getElementById('model-lock').innerHTML = LOCK_SVG;

            // 开场白（固定台词，点开即显示，不消耗对话轮数）
            const GREETING = '你好，我是棱镜（Prism）——由 LoogArc（长弧）定义并部署的模型交流界面。\nLoogArc（长弧）是由大学生任继锋与汪子雯两人组成的独立创作团队。\n\n当前页面由两个模块组成：\n· index（上半屏）——致力于无广告与快速检索的搜索引擎，目前形态为搜索窗口；\n· Static（下半屏）——测试期中的加密通讯软件，支持双向与多向交流，以及广域网范围内的推文发送。\n\n你可以点击对应区域进入模块，也可以在这里向我提问（匿名访客最多 3 轮对话）。有什么想了解的？';

            // 对话历史（含轮数计数）
            let history = [];      // 发给 API 的消息（不含开场白）
            let turnsLeft = 3;
            let greeted = false;
            let sending = false;

            function openPrism() {
                prismPanel.classList.add('open');
                prismOverlay.classList.add('show');
                if (!greeted) {
                    greeted = true;
                    appendMsg('assistant', GREETING);
                }
                prismLog.scrollTop = prismLog.scrollHeight;
            }
            function closePrism() {
                prismPanel.classList.remove('open');
                prismOverlay.classList.remove('show');
            }

            document.getElementById('prism-entry').addEventListener('click', openPrism);
            prismOverlay.addEventListener('click', closePrism);
            prismCloseBtn.addEventListener('click', closePrism);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closePrism();
            });

            // ---------- 消息渲染（与用户聊天同款：头像+文字+时间+会话线） ----------
            function avatarEl(isMine) {
                const el = document.createElement('div');
                el.className = 'pmsg-avatar';
                if (isMine) {
                    el.textContent = '?';
                } else {
                    el.innerHTML = PRISM_SVG;
                    el.classList.add('prism-cube');
                }
                return el;
            }

            function appendMsg(role, text) {
                const isMine = role === 'user';
                const prev = prismLog.lastElementChild;
                const row = document.createElement('div');
                row.className = 'pmsg-row ' + (isMine ? 'mine' : 'theirs');

                // 连续同类消息：灰竖线串联
                if (prev && prev.dataset.role === role) row.classList.add('continued');
                row.dataset.role = role;

                row.appendChild(avatarEl(isMine));

                const col = document.createElement('div');
                col.className = 'pmsg-col';
                const textEl = document.createElement('div');
                textEl.className = 'pmsg-text';
                textEl.textContent = text;
                const timeEl = document.createElement('div');
                timeEl.className = 'pmsg-time';
                const d = new Date();
                timeEl.textContent = (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
                    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
                col.appendChild(textEl);
                col.appendChild(timeEl);
                row.appendChild(col);
                prismLog.appendChild(row);
                prismLog.scrollTop = prismLog.scrollHeight;
            }

            function updateTurns() {
                prismTurns.textContent = turnsLeft > 0 ? ('剩余 ' + turnsLeft + ' 轮对话') : '匿名对话已达上限';
            }

            // ---------- 发送 ----------
            async function send() {
                const text = prismInput.value.trim();
                if (!text || sending) return;
                if (turnsLeft <= 0) {
                    prismStatus.textContent = '匿名对话已达 3 轮上限，登录 Static 后可继续交流';
                    return;
                }

                appendMsg('user', text);
                history.push({ role: 'user', content: text });
                prismInput.value = '';

                sending = true;
                prismSendBtn.disabled = true;
                prismStatus.textContent = '...';
                try {
                    const res = await fetch('/api/ai', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ anonymous: true, messages: history })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        appendMsg('assistant', data.reply);
                        history.push({ role: 'assistant', content: data.reply });
                        turnsLeft = typeof data.turnsLeft === 'number' ? data.turnsLeft : (turnsLeft - 1);
                        prismStatus.textContent = '';
                    } else if (data.quotaExceeded) {
                        turnsLeft = 0;
                        prismStatus.textContent = data.message || '匿名对话已达上限';
                    } else if (res.status === 401) {
                        prismStatus.textContent = '登录已过期';
                    } else {
                        prismStatus.textContent = data.message || '请求失败';
                    }
                } catch (e) {
                    prismStatus.textContent = '网络异常';
                }
                sending = false;
                prismSendBtn.disabled = false;
                updateTurns();
            }

            prismSendBtn.addEventListener('click', send);
            prismInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.isComposing) {
                    e.preventDefault();
                    send();
                }
            });
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            font-family: Arial, sans-serif;
        }

        /* 顶部提示语 */
        .select-hint {
            text-align: center;
            padding: 28px 16px 0;
            flex-shrink: 0;
        }

        .select-hint span {
            font-size: 13px;
            color: var(--text-mid);
            letter-spacing: 3px;
        }

        /* 上下两半屏（只是布局容器，不可点击） */
        .half {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
        }

        /* 中间的白色横线 */
        .divider {
            height: 1px;
            background: var(--fg);
            flex-shrink: 0;
        }

        /* 模块入口：白色矩形框本身才是链接 */
        .module-link {
            text-decoration: none;
            display: inline-block;
        }

        .module-box {
            border: 1px solid var(--fg);
            padding: 18px 56px;
            transition: all 0.3s ease;
        }

        .module-box span {
            font-size: 34px;
            font-weight: 700;
            font-style: italic;
            color: var(--fg);
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .module-link:hover .module-box {
            background: var(--fg);
        }

        .module-link:hover .module-box span {
            color: var(--bg);
        }

        /* 框下的说明 */
        .module-desc {
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-mid);
            line-height: 1.7;
            text-align: center;
            max-width: 340px;
        }

        /* 页尾声明 */
        .site-footer {
            text-align: center;
            padding: 14px 16px 18px;
            flex-shrink: 0;
        }

        .copyright {
            font-size: 13px;
            color: var(--text-mid);
            font-style: italic;
            font-weight: bold;
            line-height: 1.6;
        }

        .copyright-zh {
            margin-bottom: 4px;
        }

        /* ---------- 右上角 Prism 入口 ---------- */
        .prism-entry {
            position: fixed;
            top: 20px;
            right: 68px;
            z-index: 1000;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .prism-entry svg {
            width: 40px;
            height: 40px;
            display: block;
        }

        .prism-entry:hover {
            opacity: 0.7;
        }

        /* ---------- Prism 悬浮聊天框 ---------- */
        .prism-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 2999;
        }

        .prism-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .prism-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -46%);
            width: min(840px, calc(100vw - 32px));
            max-height: min(1200px, calc(100vh - 96px));
            display: flex;
            flex-direction: column;
            background: var(--bg);
            border: 1px solid var(--border-soft);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 3000;
        }

        .prism-panel.open {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%);
        }

        .prism-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-strong);
            flex-shrink: 0;
        }

        .prism-head-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        .prism-head-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .prism-head-text {
            display: flex;
            flex-direction: column;
        }

        .prism-head-name {
            font-size: 15px;
            color: var(--fg);
            font-weight: 700;
        }

        .prism-head-id {
            font-size: 11px;
            color: var(--text-dim);
        }

        /* 模型名标签（锁=当前唯一模型，以后多模型换箭头） */
        .model-tag {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-left: 16px;
            font-size: 11px;
            color: var(--text-dim);
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            flex-shrink: 0;
        }

        .model-tag svg {
            width: 11px;
            height: 11px;
            stroke: var(--text-dim);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .prism-close {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-mid);
            font-size: 20px;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            cursor: pointer;
            padding: 2px 8px;
            transition: color 0.3s ease;
        }

        .prism-close:hover {
            color: var(--fg);
        }

        .prism-log {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 16px;
            display: flex;
            flex-direction: column;
            min-height: 120px;
        }

        .pmsg-row {
            display: flex;
            align-items: flex-start;
            width: 100%;
            padding: 12px 0;
            border-bottom: 1px solid var(--fg);
        }

        .pmsg-row.continued {
            border-bottom: none;
            padding-bottom: 0;
            position: relative;
        }

        .pmsg-row.continued + .pmsg-row {
            padding-top: 8px;
        }

        .pmsg-row.continued::after {
            content: '';
            position: absolute;
            top: 44px;
            bottom: -8px;
            width: 1px;
            background: var(--border-soft);
        }

        .pmsg-row.continued.theirs::after {
            left: 26px;
        }

        .pmsg-row.continued.mine::after {
            right: 26px;
        }

        .pmsg-row.mine {
            flex-direction: row-reverse;
        }

        .pmsg-row.mine .pmsg-col {
            align-items: flex-end;
        }

        .pmsg-row.theirs .pmsg-col {
            align-items: flex-start;
        }

        .pmsg-col {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .pmsg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--fg);
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            margin: 0 10px;
            overflow: hidden;
        }

        .pmsg-avatar.prism-cube {
            border: none;
        }

        .pmsg-avatar.prism-cube svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .pmsg-text {
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
            color: var(--fg);
        }

        .pmsg-time {
            font-size: 10px;
            color: var(--text-mid);
            margin-top: 4px;
        }

        .prism-status {
            font-size: 11px;
            color: var(--text-mid);
            text-align: center;
            min-height: 15px;
            flex-shrink: 0;
        }

        .prism-input-bar {
            display: flex;
            align-items: center;
            margin: 8px 12px 12px;
            border: 1px solid var(--border-soft);
            border-radius: 19px;
            padding: 4px 4px 4px 14px;
            flex-shrink: 0;
            transition: border-color 0.3s ease;
        }

        .prism-input-bar:focus-within {
            border-color: var(--fg);
        }

        .prism-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            color: var(--fg);
            outline: none;
            padding: 7px 0;
            min-width: 0;
        }

        .prism-send {
            width: 28px;
            height: 28px;
            border: 1px solid var(--border-soft);
            border-radius: 50%;
            background: var(--bg);
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .prism-send svg {
            width: 11px;
            height: 15px;
            display: block;
            stroke: var(--fg);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.3s ease;
        }

        .prism-send:hover:not(:disabled) {
            background: var(--fg);
        }

        .prism-send:hover:not(:disabled) svg {
            stroke: var(--bg);
        }

        .prism-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .select-hint {
                padding: 20px 16px 0;
            }

            .select-hint span {
                font-size: 11px;
                letter-spacing: 2px;
            }

            .module-box {
                padding: 14px 40px;
            }

            .module-box span {
                font-size: 26px;
            }

            .module-desc {
                margin-top: 14px;
                font-size: 12px;
                max-width: 280px;
            }

            .copyright {
                font-size: 11px;
                line-height: 1.5;
            }

            .prism-entry {
                top: 14px;
                right: 58px;
            }

            .prism-entry svg {
                width: 32px;
                height: 32px;
            }
        }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="/icon-512.png">
</head>
<body>
    <div class="select-hint"><span>请选择您想要使用的模块</span></div>

    <div class="half">
        <a class="module-link" href="search.html">
            <div class="module-box"><span>index</span></div>
        </a>
        <div class="module-desc">基于 Microsoft Bing 的搜索窗口</div>
    </div>

    <div class="divider"></div>

    <div class="half">
        <a class="module-link" href="login.html">
            <div class="module-box"><span>Static</span></div>
        </a>
        <div class="module-desc">面向注册成员的加密通讯模块。消息经端到端加密传输与存储，仅对话双方可见。</div>
    </div>

    <div class="site-footer">
        <div class="copyright copyright-zh">版权所有 &copy; 2026 任继锋、汪子雯 保留所有权利。</div>
        <div class="copyright">Copyright &copy; 2026 Ren Jifeng &amp; Wang Ziwen. All rights reserved.</div>
    </div>

    <!-- 右上角 Prism 入口 -->
    <div class="prism-entry" id="prism-entry" title="棱镜" aria-label="棱镜">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <g stroke-linejoin="round" stroke-linecap="round">
                <path d="M 256.00,256.00 L 89.72,160.00 L 256.00,64.00 L 422.28,160.00 Z" fill="#D9DEE4" stroke="none"/>
                <path d="M 256.00,256.00 L 256.00,448.00 L 89.72,352.00 L 89.72,160.00 Z" fill="#7A818B" stroke="none"/>
                <path d="M 256.00,256.00 L 422.28,160.00 L 422.28,352.00 L 256.00,448.00 Z" fill="#343A42" stroke="none"/>
                <g stroke="var(--fg)" stroke-width="18.0" fill="none">
                    <line x1="256.00" y1="256.00" x2="89.72" y2="160.00"/>
                    <line x1="256.00" y1="256.00" x2="422.28" y2="160.00"/>
                    <line x1="256.00" y1="256.00" x2="256.00" y2="448.00"/>
                </g>
                <path d="M 256.00,64.00 L 422.28,160.00 L 422.28,352.00 L 256.00,448.00 L 89.72,352.00 L 89.72,160.00 Z" fill="none" stroke="var(--fg)" stroke-width="22.0"/>
            </g>
        </svg>
    </div>

    <!-- Prism 悬浮聊天框（匿名导览，3 轮） -->
    <div class="prism-overlay" id="prism-overlay"></div>
    <div class="prism-panel" id="prism-panel">
        <div class="prism-head">
            <div class="prism-head-icon" id="prism-head-icon"></div>
            <div class="prism-head-text">
                <div class="prism-head-name">棱镜</div>
                <div class="prism-head-id">Prism · <span id="prism-turns"></span></div>
            </div>
            <div class="model-tag" title="当前唯一可用模型">
                <span id="model-lock"></span>GLM-4.7-Flash
            </div>
            <button class="prism-close" id="prism-close" type="button">&times;</button>
        </div>
        <div class="prism-log" id="prism-log"></div>
        <div class="prism-status" id="prism-status"></div>
        <div class="prism-input-bar">
            <input type="text" class="prism-input" id="prism-input" placeholder="" autocomplete="off" maxlength="500">
            <button class="prism-send" id="prism-send" type="button" title="发送" aria-label="发送">
                <svg viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 18 L8 2 M3 7 L8 2 L13 7"/>
                </svg>
            </button>
        </div>
    </div>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function(){});
    }
    </script>
</body>
</html>
