<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static · 对话</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><text x='50' y='65' font-size='60' fill='%23ffffff' text-anchor='middle' font-family='cursive'>i</text></svg>">
    <script>
        // 共享加密工具（与 static.html 保持一致的派生方式）
        const StaticCrypto = {
            async deriveKey(myId, peerId, passwordHash) {
                const material = [myId, peerId].sort().join('::') + '::' + passwordHash;
                const raw = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(material));
                return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
            },
            async encrypt(key, plaintext) {
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(plaintext));
                return btoa(String.fromCharCode(...iv)) + '.' + btoa(String.fromCharCode(...new Uint8Array(ct)));
            },
            async decrypt(key, payload) {
                try {
                    const parts = payload.split('.');
                    if (parts.length !== 2) return null;
                    const iv = Uint8Array.from(atob(parts[0]), c => c.charCodeAt(0));
                    const ct = Uint8Array.from(atob(parts[1]), c => c.charCodeAt(0));
                    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
                    return new TextDecoder().decode(pt);
                } catch (e) { return null; } // 解码或解密失败=格式不对/被篡改/密钥不符
            }
        };

        document.addEventListener('DOMContentLoaded', async function() {
            // 会话信息
            const myId = sessionStorage.getItem('static_id');
            const myName = sessionStorage.getItem('static_name') || myId;
            const myToken = sessionStorage.getItem('static_token');
            const myHash = sessionStorage.getItem('static_hash');

            if (!myId || !myToken) {
                window.location.href = 'login.html';
                return;
            }

            // 对话对象
            const params = new URLSearchParams(window.location.search);
            const peerId = (params.get('peer') || '').replace(/^@/, '');

            if (!/^[a-zA-Z0-9]+$/.test(peerId)) {
                window.location.href = 'static.html';
                return;
            }

            document.getElementById('peer-name').textContent = '@' + peerId;
            document.getElementById('peer-id').textContent = '@' + peerId;

            // 双方资料缓存（消息区头像用：头像图片或名字首字符）
            const profiles = {}; // id -> { name, avatar }
            async function loadProfile(id) {
                try {
                    const res = await fetch('/api/profile?id=' + encodeURIComponent(id));
                    const data = await res.json();
                    if (data.ok) profiles[id] = { name: data.name, avatar: data.avatar };
                } catch (e) {}
            }

            // 先拉齐双方资料再渲染消息（否则头像竞态会回退显示「@」）
            await Promise.all([loadProfile(peerId), loadProfile(myId)]);
            const peerP = profiles[peerId];
            if (peerP) document.getElementById('peer-name').textContent = peerP.name;

            // 加密密钥（两人ID + 密码哈希派生）
            const key = await StaticCrypto.deriveKey(myId, peerId, myHash);

            // ---------- 界面元素 ----------
            const messagesEl = document.getElementById('messages');
            const inputEl = document.getElementById('msg-input');
            const sendBtn = document.getElementById('send-btn');
            const statusEl = document.getElementById('conn-status');

            let rendered = ''; // 已渲染的消息指纹，避免重复渲染
            let polling = null;

            // ---------- 消息渲染 ----------
            // 每条消息：头像（我右他左）+ 文字 + 时间，底部白线分隔（码表风格）
            function makeAvatarEl(senderId) {
                const el = document.createElement('div');
                el.className = 'msg-avatar';
                const p = profiles[senderId];
                if (p && p.avatar) {
                    el.style.backgroundImage = 'url(' + p.avatar + ')';
                    el.classList.add('has-img');
                } else {
                    el.textContent = ((p && p.name) || '@' + senderId).charAt(0).toUpperCase();
                }
                return el;
            }

            function renderMessages(messages) {
                const fingerprint = messages.length + ':' + (messages[messages.length - 1] ? messages[messages.length - 1].ts : 0);
                if (fingerprint === rendered) return;
                rendered = fingerprint;

                messagesEl.innerHTML = '';
                messages.forEach((m, idx) => {
                    const isMine = m.from === myId;
                    const row = document.createElement('div');
                    row.className = 'msg-row ' + (isMine ? 'mine' : 'theirs');

                    // 连续消息：去白线，头像下挂灰色竖线连到下一条
                    const next = messages[idx + 1];
                    if (next && next.from === m.from) {
                        row.classList.add('continued');
                    }

                    // 每条消息都带头像
                    row.appendChild(makeAvatarEl(m.from));

                    const col = document.createElement('div');
                    col.className = 'msg-col';

                    const textEl = document.createElement('div');
                    textEl.className = 'msg-text';

                    // 解密（异步，但不改变 DOM 顺序）
                    StaticCrypto.decrypt(key, m.ct).then(text => {
                        if (text === null) {
                            textEl.textContent = '[无法解密的消息]';
                            textEl.classList.add('undecryptable');
                        } else {
                            textEl.textContent = text;
                        }
                    });

                    // 时间戳：月/日 时:分
                    const timeEl = document.createElement('div');
                    timeEl.className = 'msg-time';
                    const d = new Date(m.ts);
                    timeEl.textContent = (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
                        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');

                    col.appendChild(textEl);
                    col.appendChild(timeEl);
                    row.appendChild(col);
                    messagesEl.appendChild(row);
                });

                // 滚到底部
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            // ---------- 拉取消息（2秒轮询） ----------
            async function fetchMessages() {
                try {
                    const res = await fetch('/api/chat?token=' + encodeURIComponent(myToken) + '&peer=' + encodeURIComponent(peerId));
                    if (res.status === 401) {
                        clearInterval(polling);
                        statusEl.textContent = '登录已过期，请重新登录';
                        setTimeout(() => window.location.href = 'login.html', 2000);
                        return;
                    }
                    const data = await res.json();
                    if (data.ok) {
                        renderMessages(data.messages);
                        statusEl.textContent = '';
                    }
                } catch (e) {
                    statusEl.textContent = '连接中断，重试中...';
                }
            }

            polling = setInterval(fetchMessages, 2000);
            fetchMessages(); // 立即拉一次

            // ---------- 发送消息 ----------
            async function sendMessage() {
                const text = inputEl.value.trim();
                if (!text) return;

                sendBtn.disabled = true;
                try {
                    const ciphertext = await StaticCrypto.encrypt(key, text);
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: myToken, to: peerId, ciphertext: ciphertext })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        inputEl.value = '';
                        fetchMessages(); // 立即刷新
                    } else {
                        statusEl.textContent = data.message || '发送失败';
                    }
                } catch (e) {
                    statusEl.textContent = '网络异常，消息未发出';
                }
                sendBtn.disabled = false;
                inputEl.focus();
            }

            sendBtn.addEventListener('click', sendMessage);
            inputEl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.isComposing) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // ---------- Prism 悬浮聊天框（与 static.html 同款，独立历史） ----------
            const PRISM_SVG = '<svg viewBox="0 0 512 512"><g stroke-linejoin="round" stroke-linecap="round"><path d="M256,256 L89.72,160 L256,64 L422.28,160 Z" fill="#D9DEE4"/><path d="M256,256 L256,448 L89.72,352 L89.72,160 Z" fill="#7A818B"/><path d="M256,256 L422.28,160 L422.28,352 L256,448 Z" fill="#343A42"/><g stroke="#FFFFFF" stroke-width="18" fill="none"><line x1="256" y1="256" x2="89.72" y2="160"/><line x1="256" y1="256" x2="422.28" y2="160"/><line x1="256" y1="256" x2="256" y2="448"/></g><path d="M256,64 L422.28,160 L422.28,352 L256,448 L89.72,352 L89.72,160 Z" fill="none" stroke="#FFFFFF" stroke-width="22"/></g></svg>';

            const prismPanel = document.getElementById('prism-panel');
            const prismOverlay = document.getElementById('prism-overlay');
            const prismCloseBtn = document.getElementById('prism-close');
            const prismLog = document.getElementById('prism-log');
            const prismInput = document.getElementById('prism-input');
            const prismSendBtn = document.getElementById('prism-send');
            const prismStatus = document.getElementById('prism-status');
            document.getElementById('prism-head-icon').innerHTML = PRISM_SVG;

            // 对话历史存 sessionStorage（与码表页的 prism 历史分开存）
            const PRISM_KEY = 'prism_history_' + myId;
            let prismHistory = [];
            try { prismHistory = JSON.parse(sessionStorage.getItem(PRISM_KEY)) || []; } catch (e) {}

            function openPrism() {
                prismPanel.classList.add('open');
                prismOverlay.classList.add('show');
                renderPrism();
            }
            function closePrism() {
                prismPanel.classList.remove('open');
                prismOverlay.classList.remove('show');
            }

            document.getElementById('prism-entry').addEventListener('click', openPrism);
            prismOverlay.addEventListener('click', closePrism);
            prismCloseBtn.addEventListener('click', closePrism);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closePrism();
            });

            // 消息渲染：与用户间聊天同款（头像+文字+时间+会话线）
            function prismAvatarEl(isMine) {
                const el = document.createElement('div');
                el.className = 'pmsg-avatar';
                if (isMine) {
                    const p = profiles[myId];
                    if (p && p.avatar) {
                        el.style.backgroundImage = 'url(' + p.avatar + ')';
                        el.classList.add('has-img');
                    } else {
                        el.textContent = (myName || '@').charAt(0).toUpperCase();
                    }
                } else {
                    el.innerHTML = PRISM_SVG;
                    el.classList.add('prism-cube');
                }
                return el;
            }

            function renderPrism() {
                prismLog.innerHTML = '';
                prismHistory.forEach((m, idx) => {
                    const isMine = m.role === 'user';
                    const row = document.createElement('div');
                    row.className = 'pmsg-row ' + (isMine ? 'mine' : 'theirs');

                    const next = prismHistory[idx + 1];
                    if (next && next.role === m.role) row.classList.add('continued');

                    row.appendChild(prismAvatarEl(isMine));

                    const col = document.createElement('div');
                    col.className = 'pmsg-col';
                    const textEl = document.createElement('div');
                    textEl.className = 'pmsg-text';
                    textEl.textContent = m.content;
                    const timeEl = document.createElement('div');
                    timeEl.className = 'pmsg-time';
                    const d = new Date(m.ts);
                    timeEl.textContent = (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
                        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
                    col.appendChild(textEl);
                    col.appendChild(timeEl);
                    row.appendChild(col);
                    prismLog.appendChild(row);
                });
                prismLog.scrollTop = prismLog.scrollHeight;
            }

            async function prismSend() {
                const text = prismInput.value.trim();
                if (!text || prismSendBtn.disabled) return;

                prismHistory.push({ role: 'user', content: text, ts: Date.now() });
                savePrismHistory();
                renderPrism();
                prismInput.value = '';
                prismInput.focus();

                prismSendBtn.disabled = true;
                prismStatus.textContent = '...';
                try {
                    const res = await fetch('/api/ai', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: myToken, messages: prismHistory.map(m => ({ role: m.role, content: m.content })) })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        prismHistory.push({ role: 'assistant', content: data.reply, ts: Date.now() });
                        savePrismHistory();
                        renderPrism();
                        prismStatus.textContent = '';
                    } else if (res.status === 401) {
                        prismStatus.textContent = '登录已过期';
                    } else {
                        prismStatus.textContent = data.message || '请求失败';
                    }
                } catch (e) {
                    prismStatus.textContent = '网络异常';
                }
                prismSendBtn.disabled = false;
            }

            function savePrismHistory() {
                try {
                    sessionStorage.setItem(PRISM_KEY, JSON.stringify(prismHistory.slice(-40)));
                } catch (e) {}
            }

            prismSendBtn.addEventListener('click', prismSend);
            prismInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.isComposing) {
                    e.preventDefault();
                    prismSend();
                }
            });
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000000;
            font-family: Arial, sans-serif;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #262626;
            flex-shrink: 0;
        }

        .back-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 20px;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            transition: opacity 0.3s ease;
            padding: 2px 10px;
        }

        .back-link:hover {
            opacity: 0.6;
        }

        .peer-info {
            display: flex;
            flex-direction: column;
        }

        .peer-name {
            font-size: 15px;
            color: #ffffff;
            font-weight: 700;
        }

        .peer-id {
            font-size: 11px;
            color: #666666;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 16px;
            display: flex;
            flex-direction: column;
        }

        /* 消息条目：码表风格——每条一头像+文字+时间，底部白线 */
        .msg-row {
            display: flex;
            align-items: flex-start;
            width: 100%;
            padding: 12px 0;
            border-bottom: 1px solid #ffffff;
        }

        /* 连续消息：无白线，头像下垂灰竖线连到下一条（X 式会话线） */
        .msg-row.continued {
            border-bottom: none;
            padding-bottom: 0;
            position: relative;
        }

        .msg-row.continued + .msg-row {
            padding-top: 8px;
        }

        .msg-row.continued::after {
            content: '';
            position: absolute;
            top: 44px; /* 头像（32px）底部再往下一点 */
            bottom: -8px; /* 延伸进下一条消息的 padding-top，衔接下一个头像 */
            width: 1px;
            background: #404040;
        }

        .msg-row.continued.theirs::after {
            left: 26px; /* 左侧头像中心（10px margin + 16px 半宽） */
        }

        .msg-row.continued.mine::after {
            right: 26px;
        }

        .msg-row.mine {
            flex-direction: row-reverse; /* 头像贴右 */
        }

        .msg-row.mine .msg-col {
            align-items: flex-end;
        }

        .msg-row.theirs .msg-col {
            align-items: flex-start;
        }

        .msg-col {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #404040;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            margin: 0 10px;
        }

        .msg-text {
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
            color: #ffffff;
        }

        .msg-text.undecryptable {
            color: #aa6666;
            font-style: italic;
        }

        .msg-time {
            font-size: 10px;
            color: #888888;
            margin-top: 4px;
        }

        .chat-input-bar {
            display: flex;
            align-items: center;
            margin: 10px 16px;
            border: 1px solid #404040;
            border-radius: 19px;
            padding: 4px 4px 4px 14px;
            flex-shrink: 0;
            transition: border-color 0.3s ease;
        }

        .chat-input-bar:focus-within {
            border-color: #ffffff;
        }

        .msg-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            resize: none;
            padding: 7px 0;
            min-width: 0;
        }

        .msg-input:focus {
            border: none;
        }

        .send-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #404040;
            border-radius: 50%;
            background: #000000;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .send-btn svg {
            width: 11px;
            height: 15px;
            display: block;
            stroke: #ffffff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.3s ease;
        }

        .send-btn:hover:not(:disabled) {
            background: #ffffff;
        }

        .send-btn:hover:not(:disabled) svg {
            stroke: #000000;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .conn-status {
            font-size: 11px;
            color: #aa6666;
            text-align: center;
            min-height: 0;
            padding: 0;
        }

        /* ---------- 右上角 prism 入口 ---------- */
        .prism-entry {
            position: fixed;
            top: 14px;
            right: 16px;
            z-index: 1000;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .prism-entry svg {
            width: 40px;
            height: 40px;
            display: block;
        }

        .prism-entry:hover {
            opacity: 0.7;
        }

        /* ---------- Prism 悬浮聊天框 ---------- */
        .prism-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 2999;
        }

        .prism-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .prism-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -46%);
            width: min(840px, calc(100vw - 32px));
            max-height: min(1200px, calc(100vh - 96px));
            display: flex;
            flex-direction: column;
            background: #000000;
            border: 1px solid #404040;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 3000;
        }

        .prism-panel.open {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%);
        }

        .prism-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #262626;
            flex-shrink: 0;
        }

        .prism-head-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        .prism-head-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .prism-head-text {
            display: flex;
            flex-direction: column;
        }

        .prism-head-name {
            font-size: 15px;
            color: #ffffff;
            font-weight: 700;
        }

        .prism-head-id {
            font-size: 11px;
            color: #666666;
        }

        .prism-close {
            margin-left: auto;
            background: none;
            border: none;
            color: #888888;
            font-size: 20px;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            cursor: pointer;
            padding: 2px 8px;
            transition: color 0.3s ease;
        }

        .prism-close:hover {
            color: #ffffff;
        }

        .prism-log {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 16px;
            display: flex;
            flex-direction: column;
            min-height: 120px;
        }

        .pmsg-row {
            display: flex;
            align-items: flex-start;
            width: 100%;
            padding: 12px 0;
            border-bottom: 1px solid #ffffff;
        }

        .pmsg-row.continued {
            border-bottom: none;
            padding-bottom: 0;
            position: relative;
        }

        .pmsg-row.continued + .pmsg-row {
            padding-top: 8px;
        }

        .pmsg-row.continued::after {
            content: '';
            position: absolute;
            top: 44px;
            bottom: -8px;
            width: 1px;
            background: #404040;
        }

        .pmsg-row.continued.theirs::after {
            left: 26px;
        }

        .pmsg-row.continued.mine::after {
            right: 26px;
        }

        .pmsg-row.mine {
            flex-direction: row-reverse;
        }

        .pmsg-row.mine .pmsg-col {
            align-items: flex-end;
        }

        .pmsg-row.theirs .pmsg-col {
            align-items: flex-start;
        }

        .pmsg-col {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .pmsg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #404040;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            margin: 0 10px;
            overflow: hidden;
        }

        .pmsg-avatar.prism-cube {
            border: none;
        }

        .pmsg-avatar.prism-cube svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .pmsg-text {
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
            color: #ffffff;
        }

        .pmsg-time {
            font-size: 10px;
            color: #888888;
            margin-top: 4px;
        }

        .prism-status {
            font-size: 11px;
            color: #888888;
            text-align: center;
            min-height: 15px;
            flex-shrink: 0;
        }

        .prism-input-bar {
            display: flex;
            align-items: center;
            margin: 8px 12px 12px;
            border: 1px solid #404040;
            border-radius: 19px;
            padding: 4px 4px 4px 14px;
            flex-shrink: 0;
            transition: border-color 0.3s ease;
        }

        .prism-input-bar:focus-within {
            border-color: #ffffff;
        }

        .prism-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            padding: 7px 0;
            min-width: 0;
        }

        .prism-send {
            width: 28px;
            height: 28px;
            border: 1px solid #404040;
            border-radius: 50%;
            background: #000000;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .prism-send svg {
            width: 11px;
            height: 15px;
            display: block;
            stroke: #ffffff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.3s ease;
        }

        .prism-send:hover:not(:disabled) {
            background: #ffffff;
        }

        .prism-send:hover:not(:disabled) svg {
            stroke: #000000;
        }

        .prism-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .messages {
                padding: 12px;
            }

            .prism-entry {
                top: 10px;
                right: 12px;
            }

            .prism-entry svg {
                width: 32px;
                height: 32px;
            }

            .chat-input-bar {
                margin: 8px auto;
                width: calc(100% - 88px);
                padding: 3px 3px 3px 12px;
                border-radius: 17px;
            }

            .msg-input {
                padding: 5px 0;
                font-size: 13px;
            }

            .send-btn {
                width: 26px;
                height: 26px;
            }

            .send-btn svg {
                width: 10px;
                height: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-header">
        <a class="back-link" href="static.html">&lt;</a>
        <div class="peer-info">
            <div class="peer-name" id="peer-name"></div>
            <div class="peer-id" id="peer-id"></div>
        </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="conn-status" id="conn-status"></div>

    <div class="chat-input-bar">
        <input type="text" class="msg-input" id="msg-input" placeholder="" autocomplete="off" maxlength="2000">
        <button class="send-btn" id="send-btn" title="发送" aria-label="发送">
            <svg viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 18 L8 2 M3 7 L8 2 L13 7"/>
            </svg>
        </button>
    </div>

    <!-- 右上角 prism 入口 -->
    <div class="prism-entry" id="prism-entry" title="prism" aria-label="prism">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <g stroke-linejoin="round" stroke-linecap="round">
                <path d="M 256.00,256.00 L 89.72,160.00 L 256.00,64.00 L 422.28,160.00 Z" fill="#D9DEE4" stroke="none"/>
                <path d="M 256.00,256.00 L 256.00,448.00 L 89.72,352.00 L 89.72,160.00 Z" fill="#7A818B" stroke="none"/>
                <path d="M 256.00,256.00 L 422.28,160.00 L 422.28,352.00 L 256.00,448.00 Z" fill="#343A42" stroke="none"/>
                <g stroke="#FFFFFF" stroke-width="18.0" fill="none">
                    <line x1="256.00" y1="256.00" x2="89.72" y2="160.00"/>
                    <line x1="256.00" y1="256.00" x2="422.28" y2="160.00"/>
                    <line x1="256.00" y1="256.00" x2="256.00" y2="448.00"/>
                </g>
                <path d="M 256.00,64.00 L 422.28,160.00 L 422.28,352.00 L 256.00,448.00 L 89.72,352.00 L 89.72,160.00 Z" fill="none" stroke="#FFFFFF" stroke-width="22.0"/>
            </g>
        </svg>
    </div>

    <!-- Prism 悬浮聊天框 -->
    <div class="prism-overlay" id="prism-overlay"></div>
    <div class="prism-panel" id="prism-panel">
        <div class="prism-head">
            <div class="prism-head-icon" id="prism-head-icon"></div>
            <div class="prism-head-text">
                <div class="prism-head-name">prism</div>
                <div class="prism-head-id">prism</div>
            </div>
            <button class="prism-close" id="prism-close" type="button">&times;</button>
        </div>
        <div class="prism-log" id="prism-log"></div>
        <div class="prism-status" id="prism-status"></div>
        <div class="prism-input-bar">
            <input type="text" class="prism-input" id="prism-input" placeholder="" autocomplete="off" maxlength="2000">
            <button class="prism-send" id="prism-send" type="button" title="发送" aria-label="发送">
                <svg viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 18 L8 2 M3 7 L8 2 L13 7"/>
                </svg>
            </button>
        </div>
    </div>

</body>
</html>
