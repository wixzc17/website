<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Static · 主页</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><text x='50' y='65' font-size='60' fill='%23ffffff' text-anchor='middle' font-family='cursive'>i</text></svg>">
    <script src="/verified-badge.js"></script>
    <script src="/label-badge.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const params = new URLSearchParams(window.location.search);
            const id = (params.get('id') || '').toString().trim().replace(/^@/, '');

            if (!/^[a-zA-Z0-9]+$/.test(id)) {
                window.location.href = 'static.html';
                return;
            }

            const myId = sessionStorage.getItem('static_id');
            const myToken = sessionStorage.getItem('static_token');
            const isMe = !!(myId && myId === id && myToken);

            const avatarEl = document.getElementById('user-avatar');
            const nameEl = document.getElementById('user-name');
            const idEl = document.getElementById('user-id');
            const regText = document.getElementById('user-registered-text');
            const bannerEl = document.getElementById('banner');
            const bioEl = document.getElementById('user-bio');

            idEl.textContent = '@' + id;

            function formatRegisteredAt(ts) {
                if (!ts) return null;
                const d = new Date(ts);
                if (isNaN(d.getTime())) return null;
                return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
            }

            let profileData = null;

            // 简介：纯文本展示；别人且为空时整块隐藏，自己为空时保留区域显示占位提示
            function setBio(text) {
                bioEl.textContent = text || '';
                bioEl.style.display = (!text && !isMe) ? 'none' : '';
            }

            async function loadAndRender() {
                try {
                    const res = await fetch('/api/profile?id=' + encodeURIComponent(id));
                    const data = await res.json();
                    if (!data.ok) {
                        nameEl.textContent = '用户不存在';
                        regText.textContent = '注册日期：未知';
                        setBio('');
                        return;
                    }
                    profileData = data;
                    const name = data.name || ('@' + id);
                    nameEl.textContent = name;
                    if (data.avatar) {
                        avatarEl.textContent = '';
                        avatarEl.style.backgroundImage = 'url(' + data.avatar + ')';
                    } else {
                        avatarEl.style.backgroundImage = '';
                        avatarEl.textContent = name.charAt(0).toUpperCase();
                    }
                    if (data.banner) {
                        bannerEl.style.backgroundImage = 'url(' + data.banner + ')';
                    } else {
                        bannerEl.style.backgroundImage = '';
                    }
                    const reg = formatRegisteredAt(data.registeredAt);
                    regText.textContent = reg ? ('注册日期：' + reg) : '注册日期：未知';
                    setBio(data.bio);
                } catch (e) {
                    nameEl.textContent = '加载失败';
                    regText.textContent = '注册日期：未知';
                    setBio('');
                }
            }

            await loadAndRender();

            // 认证状态：已认证 → 名字旁挂标记；未认证且是本人 → 显示「通过认证」入口框
            // （别人逛主页时不给入口框，避免变成替他人开通）
            // 创始人硬编码（不依赖 KV，创始人特权）
            var FOUNDER_VERIFIED = {
                'wixzc17': { since: '2026年9月', tier: '创始人' },
                'lixs17': { since: '2026年9月', tier: '创始人' }
            };
            var verifiedEl = document.getElementById('user-verified');
            var verifiedText = document.getElementById('user-verified-text');
            function showVerifiedDate(since, tier) {
                var suffix = tier === '企业' ? '认证' : '个人认证';
                verifiedText.textContent = '认证日期：自' + since + '获得' + tier + suffix;
                verifiedEl.hidden = false;
            }

            VerifiedBadge.check(id).then(function (set) {
                // 创始人：硬编码优先，文案特殊处理
                if (FOUNDER_VERIFIED[id]) {
                    LabelBadge.attach(nameEl, id).then(function () { VerifiedBadge.attach(nameEl, id); });
                    verifiedText.textContent = '此账号似乎在很久很久以前......获得了无限期的个人认证(这很可能是程序漏洞，我们会尽快修复！）';
                    verifiedEl.hidden = false;
                    return;
                }
                // 普通已认证用户：从 KV 读授予时间戳和类型
                if (set.has(id)) {
                    LabelBadge.attach(nameEl, id).then(function () { VerifiedBadge.attach(nameEl, id); });
                    fetch('/api/verified?id=' + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (d) {
                        if (d.ok && d.verified && d.ts) {
                            var date = new Date(d.ts);
                            var since = date.getFullYear() + '年' + (date.getMonth() + 1) + '月';
                            var tier = d.type === 'business' ? '企业' : 'Base';
                            showVerifiedDate(since, tier);
                        }
                    });
                    return;
                }
                // 未认证用户也可能被授予标记（企业可给个人账号打标），独立挂载
                LabelBadge.attach(nameEl, id);
                // 未认证且是本人 → 显示「通过认证」入口框
                if (!isMe) return;
                var iconEl = document.getElementById('verify-cta-icon');
                if (typeof VerifiedBadge.svg === 'function') iconEl.innerHTML = VerifiedBadge.svg();
                document.getElementById('verify-cta').hidden = false;
            }).catch(function () { /* 查不到认证状态就不显示入口，不影响其他功能 */ });

            // 隶属信息：有标记则在信息区显示「（方框标记）此账号隶属于 xxx」
            LabelBadge.check([id]).then(function (map) {
                var rec = map.get(id);
                if (!rec) return;
                var badgeEl = document.getElementById('user-label-badge');
                if (rec.grantedByAvatar) {
                    var img = document.createElement('img');
                    img.src = rec.grantedByAvatar;
                    img.alt = '@' + rec.grantedBy;
                    badgeEl.appendChild(img);
                } else {
                    badgeEl.textContent = rec.grantedBy.charAt(0).toUpperCase();
                }
                document.getElementById('user-label-text').textContent =
                    '此账号隶属于 ' + (rec.grantedByName || rec.grantedBy);
                document.getElementById('user-label').hidden = false;
            }).catch(function () { /* 查不到标记就不显示隶属行 */ });

            if (!isMe) return;

            // ---------- 自己的主页：元素可点击 ----------
            bannerEl.classList.add('editable');
            avatarEl.classList.add('editable');
            nameEl.classList.add('editable');
            idEl.classList.add('editable');
            bioEl.classList.add('editable');

            const overlay = document.getElementById('edit-overlay');
            const cropModal = document.getElementById('modal-crop');
            const nameModal = document.getElementById('modal-name');
            const idModal = document.getElementById('modal-id');
            const bioModal = document.getElementById('modal-bio');
            const cropTitle = document.getElementById('crop-title');
            const cropRatioHint = document.getElementById('crop-ratio-hint');

            let openModalEl = null;
            function openModal(el) {
                overlay.classList.add('show');
                el.classList.add('open');
                openModalEl = el;
            }
            function closeModal() {
                overlay.classList.remove('show');
                if (openModalEl) openModalEl.classList.remove('open');
                openModalEl = null;
            }
            overlay.addEventListener('click', closeModal);
            document.querySelectorAll('.modal-close, [data-close]').forEach(b => b.addEventListener('click', closeModal));
            document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

            // ---------- 裁剪器 ----------
            const cropBox = document.getElementById('cropper-box');
            const cropImg = document.getElementById('cropper-img');
            const cropHint = document.getElementById('crop-hint');
            const cropConfirm = document.getElementById('crop-confirm');
            const cropFileInput = document.getElementById('crop-file');

            let cropMode = 'avatar';   // 'avatar' 1:1 / 'banner' 4:3
            let cropRatio = 1;
            let cropScale = 1, cropTx = 0, cropTy = 0;
            let cropBoxW = 0, cropBoxH = 0;
            let cropImgEl = null;

            function resetCropper(mode) {
                cropMode = mode;
                cropRatio = mode === 'avatar' ? 1 : 4 / 3;
                cropTitle.textContent = mode === 'avatar' ? '修改头像' : '修改背景图';
                cropRatioHint.textContent = mode === 'avatar' ? '比例为 1:1' : '比例为 4:3';
                cropImgEl = null;
                cropImg.removeAttribute('src');
                cropImg.style.display = 'none';
                cropHint.style.display = 'flex';
                cropBox.style.height = '0px';
                cropConfirm.disabled = true;
                cropFileInput.value = '';
            }

            function openCropper(mode) {
                resetCropper(mode);
                openModal(cropModal);
            }

            bannerEl.addEventListener('click', function() { openCropper('banner'); });
            avatarEl.addEventListener('click', function() { openCropper('avatar'); });

            document.getElementById('crop-file-btn').addEventListener('click', function() {
                cropFileInput.click();
            });

            cropFileInput.addEventListener('change', function(e) {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        cropImgEl = img;
                        cropImg.src = ev.target.result;
                        cropImg.style.display = 'block';
                        cropHint.style.display = 'none';
                        initCropLayout();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            function initCropLayout() {
                cropBoxW = cropBox.clientWidth;
                cropBoxH = cropBoxW / cropRatio;
                cropBox.style.height = cropBoxH + 'px';
                const iw = cropImgEl.naturalWidth, ih = cropImgEl.naturalHeight;
                cropScale = Math.max(cropBoxW / iw, cropBoxH / ih);
                cropTx = (cropBoxW - iw * cropScale) / 2;
                cropTy = (cropBoxH - ih * cropScale) / 2;
                cropImg.style.width = iw + 'px';
                cropImg.style.height = ih + 'px';
                renderCrop();
                cropConfirm.disabled = false;
            }

            function renderCrop() {
                cropImg.style.transform = 'translate(' + cropTx + 'px,' + cropTy + 'px) scale(' + cropScale + ')';
            }

            let dragging = false, dStartX = 0, dStartY = 0, dStartTx = 0, dStartTy = 0;

            cropBox.addEventListener('mousedown', function(e) {
                if (!cropImgEl) return;
                dragging = true;
                dStartX = e.clientX; dStartY = e.clientY;
                dStartTx = cropTx; dStartTy = cropTy;
                e.preventDefault();
            });
            window.addEventListener('mousemove', function(e) {
                if (!dragging) return;
                cropTx = dStartTx + (e.clientX - dStartX);
                cropTy = dStartTy + (e.clientY - dStartY);
                renderCrop();
            });
            window.addEventListener('mouseup', function() { dragging = false; });

            cropBox.addEventListener('touchstart', function(e) {
                if (!cropImgEl || !e.touches.length) return;
                dragging = true;
                dStartX = e.touches[0].clientX; dStartY = e.touches[0].clientY;
                dStartTx = cropTx; dStartTy = cropTy;
            }, { passive: true });
            window.addEventListener('touchmove', function(e) {
                if (!dragging || !e.touches.length) return;
                cropTx = dStartTx + (e.touches[0].clientX - dStartX);
                cropTy = dStartTy + (e.touches[0].clientY - dStartY);
                renderCrop();
            }, { passive: true });
            window.addEventListener('touchend', function() { dragging = false; });

            cropBox.addEventListener('wheel', function(e) {
                if (!cropImgEl) return;
                e.preventDefault();
                const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
                const cx = cropBoxW / 2, cy = cropBoxH / 2;
                const px = (cx - cropTx) / cropScale;
                const py = (cy - cropTy) / cropScale;
                cropScale = Math.max(0.1, Math.min(10, cropScale * factor));
                cropTx = cx - px * cropScale;
                cropTy = cy - py * cropScale;
                renderCrop();
            }, { passive: false });

            function exportCrop(outW, outH, quality) {
                const srcX = -cropTx / cropScale;
                const srcY = -cropTy / cropScale;
                const srcW = cropBoxW / cropScale;
                const srcH = cropBoxH / cropScale;
                const canvas = document.createElement('canvas');
                canvas.width = outW;
                canvas.height = outH;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(cropImgEl, srcX, srcY, srcW, srcH, 0, 0, outW, outH);
                return canvas.toDataURL('image/jpeg', quality == null ? 0.85 : quality);
            }

            // 头像清晰度：从 512 高画质起导出；base64 超 API 上限(100KB)则逐级降质/降尺寸
            const AVATAR_BUDGET = 98000;
            function exportAvatar() {
                const combos = [
                    [512, 0.92], [512, 0.85], [512, 0.78],
                    [448, 0.82], [384, 0.84], [320, 0.85], [256, 0.85]
                ];
                let uri = null;
                for (let i = 0; i < combos.length; i++) {
                    uri = exportCrop(combos[i][0], combos[i][0], combos[i][1]);
                    if (uri.length <= AVATAR_BUDGET) break;
                }
                return uri;
            }

            cropConfirm.addEventListener('click', async function() {
                if (!cropImgEl) return;
                let field, dataUri;
                if (cropMode === 'avatar') {
                    field = 'avatar';
                    dataUri = exportAvatar();
                } else {
                    field = 'banner';
                    dataUri = exportCrop(1200, 900);
                }
                try {
                    const body = { token: myToken, name: profileData.name || ('@' + id) };
                    body[field] = dataUri;
                    const res = await fetch('/api/profile', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const data = await res.json();
                    if (data.ok) {
                        closeModal();
                        await loadAndRender();
                    }
                } catch (e) {}
            });

            // ---------- 用户名 ----------
            nameEl.addEventListener('click', function() {
                document.getElementById('name-edit-input').value = profileData.name || '';
                openModal(nameModal);
            });

            document.getElementById('name-save').addEventListener('click', async function() {
                const name = document.getElementById('name-edit-input').value.trim();
                if (!name || name.length > 16) return;
                try {
                    const res = await fetch('/api/profile', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: myToken, name: name })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        closeModal();
                        await loadAndRender();
                    }
                } catch (e) {}
            });

            // ---------- ID 提示 ----------
            idEl.addEventListener('click', function() { openModal(idModal); });

            // ---------- 简介 ----------
            bioEl.addEventListener('click', function() {
                document.getElementById('bio-edit-input').value = (profileData && profileData.bio) || '';
                openModal(bioModal);
            });

            document.getElementById('bio-save').addEventListener('click', async function() {
                const bio = document.getElementById('bio-edit-input').value;
                if (bio.length > 300) return;
                try {
                    const res = await fetch('/api/profile', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: myToken, name: profileData.name || ('@' + id), bio: bio })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        closeModal();
                        await loadAndRender();
                    }
                } catch (e) {}
            });

            // ---------- 标记管理（仅企业认证本人） ----------
            var labelManage = document.getElementById('label-manage');
            var labelGrantCta = document.getElementById('label-grant-cta');
            var labelGrantedSection = document.getElementById('label-granted-section');
            var labelGrantedList = document.getElementById('label-granted-list');
            var labelGrantModal = document.getElementById('modal-label-grant');
            var labelTargetInput = document.getElementById('label-target-input');
            var labelGrantError = document.getElementById('label-grant-error');

            function labelRowHtml(targetId, grantedBy, ts) {
                var date = ts ? new Date(ts).toLocaleDateString('zh-CN') : '';
                var meta = grantedBy ? ('由 @' + grantedBy + ' 授予' + (date ? ' · ' + date : '')) : '';
                return '<div class="label-row">' +
                    '<div><span class="label-row-id">@' + targetId + '</span>' +
                    (meta ? ' <span class="label-row-meta">' + meta + '</span>' : '') + '</div>' +
                    '<button class="label-revoke-btn" type="button" data-revoke="' + targetId + '">撤销</button>' +
                    '</div>';
            }

            function renderLabelList(container, items, emptyText) {
                if (!items.length) {
                    container.innerHTML = '<div class="label-empty">' + emptyText + '</div>';
                    return;
                }
                container.innerHTML = items.map(function (x) {
                    return labelRowHtml(x.targetId, x.grantedBy, x.ts);
                }).join('');
            }

            async function loadGrantedList() {
                try {
                    var res = await fetch('/api/labels?by=' + encodeURIComponent(myId) + '&token=' + encodeURIComponent(myToken));
                    var data = await res.json();
                    if (!data.ok) return;
                    var targets = data.targets || [];
                    if (!targets.length) {
                        renderLabelList(labelGrantedList, [], '还没有授予任何标记');
                    } else {
                        // 批量拿每条标记的 grantedBy / ts
                        var q = await fetch('/api/labels?ids=' + encodeURIComponent(targets.join(','))).then(function (r) { return r.json(); });
                        var map = (q.ok && q.labels) ? q.labels : {};
                        var items = targets.map(function (t) {
                            var rec = map[t] || {};
                            return { targetId: t, grantedBy: rec.grantedBy || myId, ts: rec.ts };
                        });
                        renderLabelList(labelGrantedList, items, '');
                    }
                    labelGrantedSection.hidden = false;
                } catch (e) {}
            }

            async function initLabelManage() {
                var isBusiness = false;
                try {
                    var v = await fetch('/api/verified?id=' + encodeURIComponent(myId)).then(function (r) { return r.json(); });
                    isBusiness = !!(v.ok && v.verified && v.type === 'business');
                } catch (e) {}
                if (!isBusiness) return;
                labelManage.hidden = false;
                labelGrantCta.hidden = false;
                loadGrantedList();
            }

            labelGrantCta.addEventListener('click', function () {
                labelTargetInput.value = '';
                labelGrantError.textContent = '';
                openModal(labelGrantModal);
            });

            document.getElementById('label-grant-save').addEventListener('click', async function () {
                var btn = this;
                var targetId = labelTargetInput.value.trim().replace(/^@/, '');
                if (!/^[a-zA-Z0-9]+$/.test(targetId)) {
                    labelGrantError.textContent = 'ID 不合法（仅字母数字）';
                    return;
                }
                btn.disabled = true;
                labelGrantError.textContent = '';
                try {
                    var res = await fetch('/api/labels', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: myToken, targetId: targetId, action: 'grant' })
                    });
                    var data = await res.json();
                    if (data.ok) {
                        closeModal();
                        loadGrantedList();
                    } else {
                        labelGrantError.textContent = data.message || '授予失败';
                    }
                } catch (e) {
                    labelGrantError.textContent = '网络异常';
                }
                btn.disabled = false;
            });

            // 撤销（事件委托：已授予列表）
            document.addEventListener('click', async function (e) {
                var btn = e.target.closest ? e.target.closest('[data-revoke]') : null;
                if (!btn) return;
                var targetId = btn.getAttribute('data-revoke');
                btn.disabled = true;
                try {
                    var res = await fetch('/api/labels', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: myToken, targetId: targetId, action: 'revoke' })
                    });
                    var data = await res.json();
                    if (data.ok) {
                        if (!labelGrantedSection.hidden) loadGrantedList();
                    } else {
                        alert(data.message || '撤销失败');
                    }
                } catch (e) {
                    alert('网络异常');
                }
                btn.disabled = false;
            });

            initLabelManage();

            // ---------- 返回：有历史则后退，否则回码表 ----------
            // 内联 onclick 里的 history.length>1 的「>」会被 HTML 注入器误判为标签结束，
            // 导致「出现代码」，故改用脚本绑定（2026-09-06 实测踩坑）
            document.getElementById('back-link').addEventListener('click', function(e) {
                if (history.length > 1) { e.preventDefault(); history.back(); }
            });
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            font-family: Arial, sans-serif;
            color: var(--fg);
        }

        .back-link {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top));
            left: 20px;
            font-size: 13px;
            color: var(--fg);
            text-decoration: none;
            letter-spacing: 0.5px;
            z-index: 1000;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .banner {
            height: 180px;
            background: var(--bg-soft);
            border-bottom: 1px solid var(--border-strong);
            max-width: 50%;
            margin: 0 auto;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .banner.editable {
            cursor: pointer;
        }

        .profile-card {
            padding: 0 24px 32px;
            max-width: 50%;
            margin: 0 auto;
        }

        .user-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 3px solid var(--bg);
            margin-top: -48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: var(--fg);
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            background: var(--bg);
            background-size: cover;
            background-position: center;
        }

        .user-avatar.editable {
            cursor: pointer;
        }

        .user-name {
            font-size: 22px;
            font-weight: 700;
            margin-top: 16px;
            /* 只让文字本身可点：block 会撑满整行，点右侧空白也会弹出修改窗口 */
            display: inline-block;
            width: fit-content;
            max-width: 100%;
        }

        .user-name.editable {
            cursor: pointer;
        }

        /* 名字旁的认证标记不抢点击（否则本人点标记会弹出改名字浮窗） */
        .user-name .verified-badge {
            pointer-events: none;
        }

        /* 未认证时的「通过认证」入口框：白线直角框，悬停黑白反色 */
        .verify-cta {
            /* 紧跟用户名后面（同一行右侧），不是换到下一行 */
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-left: 12px;
            vertical-align: middle;
            padding: 4px 10px;
            border: 1px solid var(--fg);
            color: var(--fg);
            font-size: 12px;
            letter-spacing: 1px;
            text-decoration: none;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .verify-cta:hover {
            background: var(--fg);
            color: var(--bg);
        }

        .verify-cta:hover .verify-cta-icon svg path {
            fill: var(--bg);
        }

        .verify-cta-icon {
            display: inline-block;
            width: 14px;
            height: 14px;
        }

        .verify-cta-icon svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .verify-cta[hidden] {
            display: none;
        }

        /* ---------- 标记管理 ---------- */
        .label-manage {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-strong);
        }

        .label-grant-btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            border: 1px solid var(--fg);
            background: var(--bg);
            color: var(--fg);
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .label-grant-btn:hover {
            background: var(--fg);
            color: var(--bg);
        }

        .label-section {
            margin-top: 18px;
        }

        .label-section-title {
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .label-list {
            display: flex;
            flex-direction: column;
        }

        .label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .label-row-id {
            font-size: 14px;
            color: var(--fg);
        }

        .label-row-meta {
            font-size: 12px;
            color: var(--text-dim);
        }

        .label-revoke-btn {
            flex-shrink: 0;
            border: 1px solid var(--border-strong);
            background: var(--bg);
            color: var(--text-mid);
            font-size: 12px;
            padding: 4px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .label-revoke-btn:hover:not(:disabled) {
            border-color: var(--fg);
            color: var(--fg);
        }

        .label-revoke-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .label-empty {
            font-size: 13px;
            color: var(--text-dim);
            padding: 8px 0;
        }

        .label-grant-error {
            font-size: 12px;
            color: #aa6666;
            margin-top: 8px;
            min-height: 16px;
        }

        .user-id {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 4px;
            /* block + fit-content：既换行到用户名下方，又只让文字本身可点
               （inline-block 会跟着认证框排在同一行） */
            display: block;
            width: fit-content;
        }

        .user-id.editable {
            cursor: pointer;
        }

        /* ---------- 简介 ---------- */
        .user-bio {
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-body);
            white-space: pre-wrap;
            word-break: break-word;
            letter-spacing: 0.3px;
        }

        .user-bio.editable {
            cursor: pointer;
        }

        /* 自己且还没写简介时，显示淡色占位提示（别人看不到） */
        .user-bio.editable:empty::before {
            content: '写下你的简介';
            color: var(--text-faint);
        }

        .user-registered {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-strong);
        }

        .date-icon {
            flex-shrink: 0;
        }

        .user-registered-text {
            font-size: 14px;
            color: var(--fg);
            letter-spacing: 0.5px;
        }

        .user-verified {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .user-verified-text {
            font-size: 14px;
            color: var(--fg);
            letter-spacing: 0.5px;
        }

        /* ---------- 隶属信息行 ---------- */
        .user-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .user-label[hidden] {
            display: none;
        }

        .user-label-badge {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            border: 1px solid var(--fg);
            border-radius: 0.2em;
            overflow: hidden;
            background: var(--bg);
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
        }

        .user-label-badge img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-label-text {
            font-size: 14px;
            color: var(--fg);
            letter-spacing: 0.5px;
        }

        /* ---------- 编辑浮窗 ---------- */
        .edit-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 3000;
        }

        .edit-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -46%);
            width: min(420px, calc(100vw - 32px));
            background: var(--bg);
            border: 1px solid var(--border-soft);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 3001;
            display: none;
        }

        .modal.open {
            display: block;
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-strong);
        }

        .modal-title {
            font-size: 15px;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-mid);
            font-size: 20px;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            cursor: pointer;
            padding: 2px 8px;
        }

        .modal-close:hover {
            color: var(--fg);
        }

        .modal-body {
            padding: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: flex-end;
        }

        .modal-btn {
            border: 1px solid var(--fg);
            background: var(--bg);
            color: var(--fg);
            font-size: 13px;
            padding: 8px 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn:hover:not(:disabled) {
            background: var(--fg);
            color: var(--bg);
        }

        .modal-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .name-edit-input {
            width: 100%;
            border: none;
            border-bottom: 1px solid var(--fg);
            background: transparent;
            color: var(--fg);
            font-size: 15px;
            padding: 10px 2px;
            outline: none;
        }

        .bio-edit-input {
            width: 100%;
            border: 1px solid var(--border-strong);
            background: transparent;
            color: var(--fg);
            font-size: 14px;
            line-height: 1.6;
            padding: 10px;
            outline: none;
            resize: vertical;
            font-family: inherit;
            box-sizing: border-box;
        }

        .bio-edit-input:focus {
            border-color: var(--fg);
        }

        .id-tip {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-body-bright);
        }

        .crop-ratio-hint {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 12px;
        }

        .cropper-box {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            touch-action: none;
            cursor: move;
        }

        .cropper-box img {
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: 0 0;
            user-select: none;
            -webkit-user-drag: none;
            max-width: none;
        }

        .crop-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .back-link {
                top: calc(10px + env(safe-area-inset-top));
                left: 12px;
                font-size: 11px;
            }

            .banner {
                max-width: 100%;
                height: 150px;
            }

            .profile-card {
                max-width: 100%;
            }
        }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="/icon-512.png">
</head>
<body>
    <a class="back-link" href="static.html" id="back-link">← Static</a>

    <div class="banner" id="banner"></div>

    <div class="profile-card">
        <div class="user-avatar" id="user-avatar">@</div>
        <div class="user-name" id="user-name"></div>
        <a class="verify-cta" id="verify-cta" href="verify.html" hidden>
            <span class="verify-cta-icon" id="verify-cta-icon"></span>
            <span>通过认证</span>
        </a>
        <div class="user-id" id="user-id"></div>
        <div class="user-bio" id="user-bio"></div>
        <div class="user-registered">
            <svg class="date-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--fg)" stroke-width="1.5" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16"></rect>
                <line x1="3" y1="10" x2="21" y2="10"></line>
                <line x1="8" y1="3" x2="8" y2="7"></line>
                <line x1="16" y1="3" x2="16" y2="7"></line>
            </svg>
            <span class="user-registered-text" id="user-registered-text">注册日期：加载中…</span>
        </div>

        <div class="user-verified" id="user-verified" hidden>
            <svg class="date-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--fg)" stroke-width="1.5" aria-hidden="true">
                <path d="M12 3 L13.5 10.5 L21 12 L13.5 13.5 L12 21 L10.5 13.5 L3 12 L10.5 10.5 Z"/>
            </svg>
            <span class="user-verified-text" id="user-verified-text"></span>
        </div>

        <!-- 隶属信息：有标记时显示「（方框标记）此账号隶属于 xxx」 -->
        <div class="user-label" id="user-label" hidden>
            <span class="user-label-badge" id="user-label-badge"></span>
            <span class="user-label-text" id="user-label-text"></span>
        </div>

        <!-- 标记管理（仅企业认证本人可见，JS 控制显示） -->
        <div class="label-manage" id="label-manage" hidden>
            <button class="label-grant-btn" id="label-grant-cta" type="button" hidden>授予标记</button>
            <div class="label-section" id="label-granted-section" hidden>
                <div class="label-section-title">我已授予的标记</div>
                <div class="label-list" id="label-granted-list"></div>
            </div>
        </div>
    </div>

    <div class="edit-overlay" id="edit-overlay"></div>

    <!-- 共用裁剪浮窗（背景图 / 头像） -->
    <div class="modal" id="modal-crop">
        <div class="modal-head">
            <div class="modal-title" id="crop-title">修改头像</div>
            <button class="modal-close" type="button">&times;</button>
        </div>
        <div class="modal-body">
            <div class="crop-ratio-hint" id="crop-ratio-hint">比例为 1:1</div>
            <div class="cropper-box" id="cropper-box">
                <div class="crop-hint" id="crop-hint">请选择图片</div>
                <img id="cropper-img" alt="">
            </div>
            <div class="modal-actions">
                <button class="modal-btn" type="button" id="crop-file-btn">选择图片</button>
                <button class="modal-btn" type="button" id="crop-confirm" disabled>确认</button>
            </div>
            <input type="file" id="crop-file" accept="image/*" style="display: none">
        </div>
    </div>

    <!-- 用户名浮窗 -->
    <div class="modal" id="modal-name">
        <div class="modal-head">
            <div class="modal-title">修改用户名</div>
            <button class="modal-close" type="button">&times;</button>
        </div>
        <div class="modal-body">
            <input type="text" class="name-edit-input" id="name-edit-input" maxlength="16" placeholder="输入新的用户名" autocomplete="off">
            <div class="modal-actions">
                <button class="modal-btn" type="button" id="name-save">保存</button>
            </div>
        </div>
    </div>

    <!-- ID 提示浮窗 -->
    <div class="modal" id="modal-id">
        <div class="modal-head">
            <div class="modal-title">账号 ID</div>
            <button class="modal-close" type="button">&times;</button>
        </div>
        <div class="modal-body">
            <div class="id-tip">账号 ID 是唯一标识，注册后无法更改。</div>
            <div class="modal-actions">
                <button class="modal-btn" type="button" data-close>知道了</button>
            </div>
        </div>
    </div>

    <!-- 授予标记浮窗 -->
    <div class="modal" id="modal-label-grant">
        <div class="modal-head">
            <div class="modal-title">授予标记</div>
            <button class="modal-close" type="button">&times;</button>
        </div>
        <div class="modal-body">
            <div class="id-tip" style="margin-bottom:12px">输入目标账号 ID。授予后，该账号用户名旁会显示你的头像作为组织归属标记。</div>
            <input type="text" class="name-edit-input" id="label-target-input" maxlength="32" placeholder="目标账号 ID" autocomplete="off">
            <div class="label-grant-error" id="label-grant-error"></div>
            <div class="modal-actions">
                <button class="modal-btn" type="button" id="label-grant-save">授予</button>
            </div>
        </div>
    </div>

    <!-- 编辑简介浮窗 -->
    <div class="modal" id="modal-bio">
        <div class="modal-head">
            <div class="modal-title">编辑简介</div>
            <button class="modal-close" type="button">&times;</button>
        </div>
        <div class="modal-body">
            <textarea class="bio-edit-input" id="bio-edit-input" maxlength="300" rows="4" placeholder="写点什么介绍自己（留空则不显示）"></textarea>
            <div class="modal-actions">
                <button class="modal-btn" type="button" id="bio-save">保存</button>
            </div>
        </div>
    </div>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function(){});
    }
    </script>
</body>
</html>
