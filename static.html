<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><text x='50' y='65' font-size='60' fill='%23ffffff' text-anchor='middle' font-family='cursive'>i</text></svg>">
    <script>
        // 共享加密工具：AES-GCM 加解密（浏览器本地完成，密文上链）
        // 密钥由双方约定，写在这里会暴露——改为从登录用户可获取的约定值派生：
        // 用「两人ID + 共同密码哈希」派生密钥，只有登录者能算出（密码哈希只在登录时存在于内存）
        const StaticCrypto = {
            async deriveKey(myId, peerId, passwordHash) {
                const material = [myId, peerId].sort().join('::') + '::' + passwordHash;
                const raw = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(material));
                return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
            },
            async encrypt(key, plaintext) {
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(plaintext));
                // base64 编码 iv + 密文
                return btoa(String.fromCharCode(...iv)) + '.' + btoa(String.fromCharCode(...new Uint8Array(ct)));
            },
            async decrypt(key, payload) {
                try {
                    const parts = payload.split('.');
                    if (parts.length !== 2) return null;
                    const iv = Uint8Array.from(atob(parts[0]), c => c.charCodeAt(0));
                    const ct = Uint8Array.from(atob(parts[1]), c => c.charCodeAt(0));
                    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
                    return new TextDecoder().decode(pt);
                } catch (e) { return null; } // 解码或解密失败=格式不对/被篡改/密钥不符
            }
        };

        document.addEventListener('DOMContentLoaded', function() {
            // 读取会话（sessionStorage 是登录时存入的，标签页关闭即失效）
            const myId = sessionStorage.getItem('static_id');
            const myName = sessionStorage.getItem('static_name') || myId;
            const myToken = sessionStorage.getItem('static_token');
            const myHash = sessionStorage.getItem('static_hash');

            // 未登录 → 回登录页
            if (!myId || !myToken) {
                window.location.href = 'login.html';
                return;
            }

            // 左上角显示自己的身份（头像先用名字首字符占位）
            document.getElementById('me-name').textContent = myName;
            document.getElementById('me-id').textContent = '@' + myId;
            const meAvatar = document.getElementById('me-avatar');
            meAvatar.textContent = (myName || '@').charAt(0).toUpperCase();

            // ---------- 侧边栏 ----------
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebar-overlay');

            function openSidebar() {
                sidebar.classList.add('open');
                sidebarOverlay.classList.add('show');
            }
            function closeSidebar() {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('show');
            }
            meAvatar.addEventListener('click', openSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);
            document.getElementById('sidebar-close').addEventListener('click', closeSidebar);

            // ---------- 资料拉取（自己的 + 联系人的，全部来自服务器，保证改名/换头像后同步） ----------
            async function fetchProfile(id) {
                try {
                    const res = await fetch('/api/profile?id=' + encodeURIComponent(id));
                    const data = await res.json();
                    if (data.ok) return { name: data.name, avatar: data.avatar };
                } catch (e) {}
                return null;
            }

            // 自己的资料 → 更新左上角名字和头像
            fetchProfile(myId).then(p => {
                if (p) {
                    document.getElementById('me-name').textContent = p.name;
                    if (p.avatar) {
                        meAvatar.textContent = '';
                        meAvatar.style.backgroundImage = 'url(' + p.avatar + ')';
                        meAvatar.classList.add('has-img');
                    }
                }
            });

            // 码表：所有注册用户（就是你们俩），不显示自己
            const allIds = ['wixzc17', 'lixs17'];
            const listEl = document.getElementById('contact-list');

            const cardEntries = []; // { card, name }，搜索时按名字匹配度重排

            allIds.filter(id => id !== myId).forEach(id => {
                const card = document.createElement('a');
                card.className = 'contact-card';
                card.href = 'chat.html?peer=' + encodeURIComponent(id);

                // 头像占位（拉到资料后替换）
                const avatar = document.createElement('div');
                avatar.className = 'contact-avatar';
                avatar.textContent = '@';
                card.appendChild(avatar);

                const info = document.createElement('div');
                info.className = 'contact-info';
                const nameEl = document.createElement('div');
                nameEl.className = 'contact-name';
                nameEl.textContent = '@' + id;
                const idEl = document.createElement('div');
                idEl.className = 'contact-id';
                idEl.textContent = '@' + id;
                info.appendChild(nameEl);
                info.appendChild(idEl);
                card.appendChild(info);

                listEl.appendChild(card);

                const entry = { card: card, name: '@' + id };
                cardEntries.push(entry);

                // 从服务器拉取对方最新资料
                fetchProfile(id).then(p => {
                    if (p) {
                        nameEl.textContent = p.name;
                        entry.name = p.name;
                        if (p.avatar) {
                            avatar.textContent = '';
                            avatar.style.backgroundImage = 'url(' + p.avatar + ')';
                            avatar.classList.add('has-img');
                        } else {
                            avatar.textContent = p.name.charAt(0).toUpperCase();
                        }
                    }
                });
            });

            // ---------- 搜索：把名字最匹配的用户排到最上面 ----------
            const searchInput = document.getElementById('contact-search');

            function matchScore(name, q) {
                const n = name.toLowerCase();
                if (n === q) return 4;          // 完全一致
                if (n.startsWith(q)) return 3;  // 开头匹配
                if (n.indexOf(q) !== -1) return 2; // 包含
                // 模糊：搜索的每个字符都出现在名字里
                let all = true;
                for (const ch of q) {
                    if (n.indexOf(ch) === -1) { all = false; break; }
                }
                return all ? 1 : 0;
            }

            function doSearch() {
                const q = searchInput.value.trim().toLowerCase();
                if (!q) {
                    // 空搜索恢复原顺序
                    cardEntries.forEach(e => listEl.appendChild(e.card));
                    return;
                }
                cardEntries
                    .map((e, i) => ({ e: e, i: i, score: matchScore(e.name, q) }))
                    .sort((a, b) => b.score - a.score || a.i - b.i)
                    .forEach(s => listEl.appendChild(s.e.card));
            }

            document.getElementById('search-btn').addEventListener('click', doSearch);
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') doSearch();
            });

            // ---------- 下拉阻尼回弹（只有联系人列表动，搜索框不动） ----------
            const scroller = document.querySelector('.static-content');
            const contactList = document.getElementById('contact-list');
            let pullStartY = 0, pulling = false;

            scroller.addEventListener('touchstart', function(e) {
                pulling = true;
                pullStartY = e.touches[0].clientY;
                contactList.style.transition = 'none';
            }, { passive: true });

            scroller.addEventListener('touchmove', function(e) {
                if (!pulling) return;
                const dy = e.touches[0].clientY - pullStartY;
                if (dy > 0 && scroller.scrollTop <= 0) {
                    // 阻尼：位移随拉动距离递减，越拉越沉
                    const offset = Math.pow(dy, 0.75);
                    contactList.style.transform = 'translateY(' + offset + 'px)';
                    e.preventDefault();
                }
            }, { passive: false });

            function springBack() {
                if (!pulling) return;
                pulling = false;
                contactList.style.transition = 'transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.1)';
                contactList.style.transform = '';
            }
            scroller.addEventListener('touchend', springBack);
            scroller.addEventListener('touchcancel', springBack);

            // 退出登录（侧边栏里，同时清除本设备的自动登录记忆）
            document.getElementById('logout-sidebar-btn').addEventListener('click', function() {
                closeSidebar();
                sessionStorage.clear();
                try {
                    localStorage.removeItem('static_remember_id');
                    localStorage.removeItem('static_remember_hash');
                } catch (e) {}
                window.location.href = 'index.html';
            });
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            display: flex;
            flex-direction: column;
            background: #000000;
            font-family: Arial, sans-serif;
        }

        .static-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 150px 20px 30px;
            overflow-y: auto;          /* 联系人多时可滚动，滚动只发生在内容区内部 */
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .search-bar {
            width: 100%;
            max-width: 420px;
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            border: 1px solid #404040;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 14px;
            background: #000000;
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            border-color: #ffffff;
        }

        .search-input::placeholder {
            color: #444444;
        }

        .search-btn {
            border: 1px solid #404040;
            border-radius: 20px;
            padding: 8px 14px;
            background: #000000;
            color: #ffffff;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn svg {
            width: 20px;
            height: 20px;
            display: block;
            fill: #ffffff;
            transition: fill 0.3s ease;
        }

        .search-btn:hover {
            background: #ffffff;
        }

        .search-btn:hover svg {
            fill: #000000;
        }

        .contact-list {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .contact-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 4px;
            border: none;
            border-bottom: 1px solid #ffffff;
            border-radius: 0;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .contact-card:hover {
            opacity: 0.7;
        }

        .contact-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid #404040;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .contact-name {
            font-size: 16px;
            color: #ffffff;
            font-weight: 700;
        }

        .contact-id {
            font-size: 12px;
            color: #666666;
            letter-spacing: 0.5px;
        }

        .sidebar-logout {
            margin-top: auto;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .back-link {
            position: fixed;
            top: 16px;
            left: 20px;
            font-size: 13px;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .me-info {
            position: fixed;
            top: 64px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        .me-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid #404040;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;
            cursor: pointer;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            transition: border-color 0.3s ease;
        }

        .me-avatar:hover {
            border-color: #ffffff;
        }

        /* 右上角 prism 图标 */
        .prism-entry {
            position: fixed;
            top: 64px;
            right: 20px;
            z-index: 1000;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .prism-entry svg {
            width: 44px;
            height: 44px;
            display: block;
        }

        .prism-entry:hover {
            opacity: 0.7;
        }

        .me-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .me-name {
            font-size: 15px;
            color: #ffffff;
            font-weight: 700;
        }

        .me-id {
            font-size: 12px;
            color: #888888;
        }

        /* 侧边栏 */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1999;
        }

        .sidebar-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 240px;
            background: #0a0a0a;
            border-right: 1px solid #262626;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 2000;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-item {
            display: block;
            padding: 12px 20px;
            font-size: 14px;
            color: #ffffff;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .sidebar-item:hover {
            background: #1a1a1a;
        }

        .sidebar-close {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 18px;
            color: #888888;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
        }

        .sidebar-close:hover {
            color: #ffffff;
        }

        /* 底部栏：竖线一分为二，左 chat 入口，右留空 */
        .bottom-bar {
            display: flex;
            height: 72px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .bar-tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .bar-tab svg {
            width: 26px;
            height: 26px;
            stroke: #ffffff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.3s ease;
        }

        .bar-tab:hover {
            background: #ffffff;
        }

        .bar-tab:hover svg {
            stroke: #000000;
        }

        /* 分隔竖线：短于底栏高度，居中 */
        .bottom-bar::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1px;
            height: 26px;
            background: #ffffff;
        }

        @media (max-width: 768px) {
            .static-content {
                padding: 110px 16px 24px;
            }

            .back-link {
                top: 10px;
                left: 12px;
                font-size: 11px;
            }

            .me-info {
                top: 50px;
                left: 12px;
                gap: 8px;
            }

            .prism-entry {
                top: 50px;
                right: 12px;
            }

            .prism-entry svg {
                width: 38px;
                height: 38px;
            }

            .me-avatar {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }

            .me-name {
                font-size: 14px;
            }

            .me-id {
                font-size: 11px;
            }

            .bottom-bar {
                height: 60px;
            }

            .bar-tab svg {
                width: 22px;
                height: 22px;
            }
        }
    </style>
</head>
<body>
    <a class="back-link" href="index.html">&larr; index</a>

    <div class="me-info">
        <div class="me-avatar" id="me-avatar" title="个人资料">@</div>
        <div class="me-text">
            <div class="me-name" id="me-name"></div>
            <div class="me-id" id="me-id"></div>
        </div>
    </div>

    <!-- 右上角 prism 入口 -->
    <div class="prism-entry" title="prism" aria-label="prism">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <g stroke-linejoin="round" stroke-linecap="round">
                <path d="M 256.00,256.00 L 89.72,160.00 L 256.00,64.00 L 422.28,160.00 Z" fill="#D9DEE4" stroke="none"/>
                <path d="M 256.00,256.00 L 256.00,448.00 L 89.72,352.00 L 89.72,160.00 Z" fill="#7A818B" stroke="none"/>
                <path d="M 256.00,256.00 L 422.28,160.00 L 422.28,352.00 L 256.00,448.00 Z" fill="#343A42" stroke="none"/>
                <g stroke="#FFFFFF" stroke-width="18.0" fill="none">
                    <line x1="256.00" y1="256.00" x2="89.72" y2="160.00"/>
                    <line x1="256.00" y1="256.00" x2="422.28" y2="160.00"/>
                    <line x1="256.00" y1="256.00" x2="256.00" y2="448.00"/>
                </g>
                <path d="M 256.00,64.00 L 422.28,160.00 L 422.28,352.00 L 256.00,448.00 L 89.72,352.00 L 89.72,160.00 Z" fill="none" stroke="#FFFFFF" stroke-width="22.0"/>
            </g>
        </svg>
    </div>

    <!-- 侧边栏（点头像弹出） -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="sidebar" id="sidebar">
        <button class="sidebar-close" id="sidebar-close" type="button">&times;</button>
        <a class="sidebar-item" href="profile.html">个人资料</a>
        <button class="sidebar-item sidebar-logout" id="logout-sidebar-btn" type="button">退出登录</button>
    </div>

    <div class="static-content">
        <div class="search-bar">
            <input type="text" class="search-input" id="contact-search" placeholder="" autocomplete="off">
            <button type="button" class="search-btn" id="search-btn" title="搜索" aria-label="搜索">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" d="M10.5 3a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/>
                    <path d="M15.9 15.9 L21 21 a1 1 0 0 1-1.4 1.4 L14.5 17.3 a1 1 0 0 1 1.4-1.4z"/>
                </svg>
            </button>
        </div>
        <div class="contact-list" id="contact-list"></div>
    </div>

    <!-- 底部栏：竖线一分为二，左 chat 入口，右留空 -->
    <div class="bottom-bar">
        <a class="bar-tab" href="static.html" title="chat" aria-label="chat">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 4h16v12H8l-4 4z"/>
            </svg>
        </a>
        <a class="bar-tab" href="plaza.html" title="plaza" aria-label="plaza">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                <path d="M4.93 19.07a10 10 0 0 1 0-14.14"/>
                <path d="M17 7a7.3 7.3 0 0 1 0 10"/>
                <path d="M7 17a7.3 7.3 0 0 1 0-10"/>
                <path d="M12 8 L13.4 10.6 L16 12 L13.4 13.4 L12 16 L10.6 13.4 L8 12 L10.6 10.6 Z"/>
            </svg>
        </a>
    </div>
</body>
