<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新日志</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000000'/><text x='50' y='65' font-size='60' fill='%23ffffff' text-anchor='middle' font-family='cursive'>i</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000000;
            font-family: Arial, sans-serif;
        }

        .changelog-content {
            flex: 1;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 60px 20px 40px;
        }

        .changelog-header {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin-bottom: 40px;
            border-bottom: 1px solid #333333;
            padding-bottom: 20px;
        }

        .changelog-title {
            font-size: 32px;
            font-weight: 700;
            font-style: italic;
            color: #ffffff;
            font-family: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', 'Monaco', 'Courier New', monospace;
            letter-spacing: 1px;
            line-height: 1;
        }

        .changelog-version {
            font-size: 14px;
            color: #666666;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .changelog-body {
            color: #cccccc;
            font-size: 14px;
            line-height: 1.8;
        }

        /* 更新记录条目（内容后续填充时使用） */
        .log-entry {
            margin-bottom: 36px;
        }

        .log-entry h2 {
            font-size: 16px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .log-entry .log-date {
            font-size: 12px;
            color: #666666;
            margin-left: 8px;
            font-weight: 400;
        }

        .log-entry ul {
            list-style: none;
        }

        .log-entry li {
            padding-left: 16px;
            position: relative;
            margin-bottom: 6px;
        }

        .log-entry li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            width: 6px;
            height: 1px;
            background: #666666;
        }

        .log-sign {
            margin-top: 14px;
            color: #999999;
            font-style: italic;
            text-align: right;
        }

        .log-note {
            margin-top: 10px;
            color: #666666;
            font-size: 13px;
        }

        .back-link {
            position: fixed;
            top: 16px;
            left: 20px;
            font-size: 13px;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .footer {
            text-align: center;
            padding: 20px;
        }

        .copyright {
            font-size: 14px;
            color: #888888;
            font-style: italic;
            font-weight: bold;
            line-height: 1.5;
        }

        /* 手机端适配 */
        @media (max-width: 768px) {
            .changelog-content {
                padding: 40px 20px 30px;
            }

            .changelog-title {
                font-size: 26px;
            }

            .back-link {
                top: 10px;
                left: 12px;
                font-size: 11px;
            }

            .copyright {
                font-size: 12px;
                line-height: 1.4;
            }
        }
    </style>
</head>
<body>
    <a class="back-link" href="index.html">&larr; 返回</a>

    <div class="changelog-content">
        <div class="changelog-header">
            <div class="changelog-title">changelog</div>
            <div class="changelog-version">更新日志</div>
        </div>

        <div class="changelog-body">
            <div class="log-entry">
                <h2>v0.0.2 <span class="log-date">2026-09-04</span></h2>
                <ul>
                    <li>任继锋和汪子雯两位工程师为index添加了不太灵光的"搜索建议栏"（不要对它抱有太大期望）。并添加了这个更新日志本身！我希望index能越来越好！感谢GLM-5.3!</li>
                </ul>
                <p class="log-sign">——汪子雯</p>
                <p class="log-note">Static正在上线中......</p>
            </div>

            <div class="log-entry">
                <h2><span class="log-date">2026-09-05</span></h2>
                <ul>
                    <li>Static 进入测试期！</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="copyright">Copyright &copy; 2026 Ren Jifeng &amp; Wang Ziwen. All rights reserved.</div>
    </div>
</body>
</html>
